            { name: "Édouard Daladier", era: "Entre-deux-guerres", dates: "1884 – 1970", role: "Président du Conseil", quote: "La paix à tout prix ou la lucidité aveugle.", bio: "Surnommé 'le Taureau de Vaucluse', signataire des accords de Munich en 1938.", anecdote: "Il aurait murmuré 'Les cons !' en voyant la foule l'acclamer à son retour de Munich.", heritage: "Symbole des illusions pacifistes avant le drame de 1939.", tags: ["Munich", "1938"] },
            { name: "Charles Maurras", era: "Entre-deux-guerres", dates: "1868 – 1952", role: "Journaliste et penseur nationaliste", quote: "La politique d'abord et le nationalisme intégral.", bio: "Chef de file de l'Action française, monarchiste nationaliste et antisémite influent.", anecdote: "Condamné à la Libération pour intelligence avec l'ennemi, il continua à polémiquer.", heritage: "Influence majeure de la droite nationaliste extrémiste.", tags: ["Action française", "Nationalisme"] },
            { name: "André Maginot", era: "Entre-deux-guerres", dates: "1877 – 1932", role: "Ministre de la Guerre", quote: "La défense de la frontière par le béton et l'acier.", bio: "Ministre de la Guerre, concepteur de la fameuse ligne de fortifications fortifiée portant son nom.", anecdote: "Il fut un grand mutilé de guerre de la Première Guerre mondiale.", heritage: "Mythe de la ligne Maginot dans la stratégie militaire française.", tags: ["Ligne Maginot", "Fortifications"] },

            // Seconde Guerre mondiale
            { name: "Charles de Gaulle", era: "Seconde Guerre mondiale", dates: "1890 – 1970", role: "Général et Chef de la France Libre", quote: "La France a perdu une bataille, mais la France n'a pas perdu la guerre.", bio: "Chef de la France Libre depuis Londres, il incarna la résistance et la reconquête de la souveraineté nationale.", anecdote: "Son appel du 18 Juin 1940 fut entendu par une poignée de personnes mais changea l'histoire.", heritage: "Sauvetage de l'honneur de la France et refondation républicaine.", tags: ["Appel du 18 Juin", "Résistance", "Londres"] },
            { name: "Pierre Laval", era: "Seconde Guerre mondiale", dates: "1883 – 1945", role: "Chef du gouvernement de Vichy", quote: "Je souhaite la victoire de l'Allemagne.", bio: "Principal artisan de la politique de collaboration active avec l'occupant nazi sous le régime de Vichy.", anecdote: "Il portait en permanence une cravate blanche caractéristique.", heritage: "Symbole absolu de la trahison nationale et de l'indignité.", tags: ["Vichy", "Collaboration", "Procès"] },
            { name: "Jean Moulin", era: "Seconde Guerre mondiale", dates: "1899 – 1943", role: "Unificateur de la Résistance", quote: "Unifier tous les mouvements dans la clandestinité.", bio: "Préfet, envoyé de de Gaulle en France occupée, il créa le Conseil national de la Résistance (CNR).", anecdote: "Il fut torturé à mort par Klaus Barbie à Lyon sans livrer aucun secret.", heritage: "Héros suprême de l'unité clandestine et de la Résistance.", tags: ["CNR", "Résistance", "Héros"] },
            { name: "Lucie Aubrac", era: "Seconde Guerre mondiale", dates: "1912 – 2007", role: "Résistante et militante", quote: "Le refus de la soumission et l'audace salvatrice.", bio: "Figure héroïque de la Résistance lyonnaise, célèbre pour avoir fait évader son mari Raymond des griffes de la Gestapo.", anecdote: "Elle organisa l'évasion armée en plein convoi de prisonniers avec un sang-froid incroyable.", heritage: "Incarne le courage indomptable des femmes dans la Résistance.", tags: ["Résistance", "Lyon", "Évasion"] },
            { name: "Raymond Aubrac", era: "Seconde Guerre mondiale", dates: "1914 – 2012", role: "Résistant", quote: "Combattre l'occupant pour la liberté retrouvée.", bio: "Ingénieur et résistant de premier plan, compagnon de lutte et d'amour de Lucie Aubrac.", anecdote: "Il fut arrêté à plusieurs reprises par la milice et la Gestapo avant d'être exfiltré vers Londres.", heritage: "Mémoire vivante des réseaux clandestins de la Résistance.", tags: ["Résistance", "Libération"] },
            { name: "Jean-Pierre Vernant", era: "Seconde Guerre mondiale", dates: "1914 – 2007", role: "Historien et résistant (Colonel Berthier)", quote: "La liberté au péril de sa vie dans les maquis.", bio: "Historien helléniste de renom et chef militaire des Forces françaises de l'intérieur (FFI) sous le pseudonyme de Colonel Berthier.", anecdote: "Il participa activement à la libération de Paris les armes à la main.", heritage: "Alliant l'érudition savante à l'engagement civique héroïque.", tags: ["FFI", "Résistance", "Historien"] },
            { name: "René Cassin", era: "Seconde Guerre mondiale", dates: "1887 – 1976", role: "Juriste et résistant", quote: "Rédiger les droits fondamentaux de l'humanité.", bio: "Compagnon de la Libération, juriste éminent, principal rédacteur de la Déclaration universelle des droits de l'homme de 1948.", anecdote: "Il perdit plusieurs membres de sa famille dans les camps de la mort nazis.", heritage: "Prix Nobel de la paix et architecte des droits humains mondiaux.", tags: ["Droits de l'homme", "Prix Nobel"] },
            { name: "François Darlan", era: "Seconde Guerre mondiale", dates: "1881 – 1942", role: "Amiral et ministre de Vichy", quote: "Collaborer pour préserver l'Empire maritime.", bio: "Amiral de la flotte, dauphin désigné de Pétain, avant de se rallier opportunément aux Alliés en Afrique du Nord.", anecdote: "Il fut assassiné à Alger par un jeune monarchiste en décembre 1942.", heritage: "Complexité et ambiguïtés des choix de la haute hiérarchie militaire en 1940.", tags: ["Vichy", "Amiral", "Alger"] },
            { name: "Henri Giraud", era: "Seconde Guerre mondiale", dates: "1879 – 1949", role: "Général d'armée", quote: "L'honneur militaire face à la défaite.", bio: "Général célèbre évadé d'une prison allemande, rival malheureux de de Gaulle pour la direction de la France libre.", anecdote: "Il réussit une évasion spectaculaire de la forteresse de Königstein en descendant par une corde de draps.", heritage: "Destin militaire tragique éclipsé par la figure de de Gaulle.", tags: ["Évasion", "Général"] },
            { name: "Winston Churchill", era: "Seconde Guerre mondiale", dates: "1874 – 1965", role: "Premier ministre du Royaume-Uni", quote: "Je n'ai à offrir que du sang, du labeur, des larmes et de la sueur.", bio: "Premier ministre britannique, indomptable adversaire d'Hitler, allié indéfectible de la France libre.", anecdote: "Il fumait d'immenses cigares havanais et brandissait le signe 'V' de la victoire en permanence.", heritage: "Sauveur de la démocratie européenne face au nazisme.", tags: ["Angleterre", "Victoire", "Cigare"] },
            { name: "Franklin D. Roosevelt", era: "Seconde Guerre mondiale", dates: "1882 – 1945", role: "Président des États-Unis", quote: "La seule chose dont nous devons avoir peur, c'est de la peur elle-même.", bio: "Président américain pendant toute la crise économique et la Seconde Guerre mondiale, architecte de la victoire alliée.", anecdote: "Atteint de poliomyélite, il dirigea les USA depuis son fauteuil roulant sans jamais le laisser paraître.", heritage: "Fondation du leadership mondial des États-Unis.", tags: ["USA", "New Deal", "Guerre"] },
            { name: "Adolf Hitler", era: "Seconde Guerre mondiale", dates: "1889 – 1945", role: "Dictateur du Troisième Reich", quote: "La haine raciale et la destruction de l'Europe.", bio: "Dictateur nazi responsable du déclenchement de la Seconde Guerre mondiale et de l'horreur de la Shoah.", anecdote: "Il se suicida dans son bunker à Berlin en avril 1945 alors que les Soviétiques encerclaient la ville.", heritage: "Le cataclysme absolu de la civilisation européenne.", tags: ["Nazi", "Shoah", "Dictateur"] },
            { name: "Benito Mussolini", era: "Seconde Guerre mondiale", dates: "1883 – 1945", role: "Dictateur fasciste italien", quote: "Le fascisme au service de l'orgueil impérial.", bio: "Dictateur fasciste de l'Italie, allié d'Hitler dans l'Axe pendant la Seconde Guerre mondiale.", anecdote: "Il fut exécuté par des partisans italiens et pendu par les pieds à Milan en 1945.", heritage: "Invention et chute du régime fasciste.", tags: ["Fascisme", "Italie", "Dictateur"] },
            { name: "Dwight Eisenhower", era: "Seconde Guerre mondiale", dates: "1890 – 1969", role: "Général américain et Commandant suprême allié", quote: "L'offensive totale pour libérer l'Europe du joug nazi.", bio: "Commandant suprême des forces expéditionnaires alliées, planificateur du débarquement de Normandie.", anecdote: "Il devint plus tard le 34e président des États-Unis.", heritage: "Libération victorieuse de l'Europe occidentale.", tags: ["Débarquement", "Normandie", "Alliés"] },
            { name: "Klaus Barbie", era: "Seconde Guerre mondiale", dates: "1913 – 1991", role: "Chef de la Gestapo à Lyon", quote: "La terreur nazie au cœur de la résistance lyonnaise.", bio: "Surnommé 'le Boureau de Lyon', responsable de la torture de Jean Moulin et de nombreux résistants.", anecdote: "Il fut extradé de Bolivie des décennies plus tard pour être jugé en France.", heritage: "Symbole des crimes contre l'humanité jugés en France.", tags: ["Gestapo", "Lyon", "Procès"] },

            // IVe République
            { name: "Vincent Auriol", era: "IVe République", dates: "1884 – 1966", role: "Premier Président de la IVe République", quote: "Inaugurer la stabilité institutionnelle républicaine.", bio: "Premier président de la IVe République, socialiste modéré, artisan de la reconstruction d'après-guerre.", anecdote: "Il reçut la reine d'Angleterre à Paris lors de voyages officiels fastueux.", heritage: "Mise en place des fragiles institutions de l'Union française.", tags: ["Président", "IVe République"] },
            { name: "René Coty", era: "IVe République", dates: "1882 – 1962", role: "Dernier Président de la IVe République", quote: "Faire face à la tourmente algérienne.", bio: "Dernier président de la IVe République, son mandat s'acheva lors de la crise du 13 mai 1958 et le retour de de Gaulle.", anecdote: "Il fit appel à de Gaulle en le qualifiant de 'plus illustre des Français'.", heritage: "Transition pacifique vers la Ve République.", tags: ["Président", "1958"] },
            { name: "Pierre Mendès France", era: "IVe République", dates: "1907 – 1982", role: "Président du Conseil", quote: "Gouverner, c'est choisir.", bio: "Président du Conseil courageux, il mit fin à la guerre d'Indochine et initia la décolonisation pacifique.", anecdote: "Il remplaça le lait par de l'alcool dans les cantines scolaires pour promouvoir la santé publique.", heritage: "Symbole de l'intégrité intellectuelle et politique.", tags: ["Gouverner c'est choisir", "Indochine"] },
            { name: "Robert Schuman", era: "IVe République", dates: "1886 – 1963", role: "Ministre des Affaires étrangères", quote: "La paix européenne par la réconciliation franco-allemande.", bio: "Ministre des Affaires étrangères, l'un des pères fondateurs de la construction européenne avec la déclaration de 1950.", anecdote: "Né allemand en Alsace-Lorraine, il possédait une double culture européenne profonde.", heritage: "Fondation de l'Union européenne.", tags: ["Europe", "Déclaration Schuman"] },
            { name: "Jean Monnet", era: "IVe République", dates: "1888 – 1979", role: "Économiste et père de l'Europe", quote: "Rien n'est possible sans les hommes, rien n'est durable sans les institutions.", bio: "Inspirateur génial de la CECA et de la Communauté européenne, infatigable bâtisseur de la paix.", anecdote: "Il ne fut jamais élu à un mandat politique mais guida les plus grands dirigeants de son époque.", heritage: "Architecte suprême de l'Europe unie.", tags: ["Europe", "Économiste"] },
            { name: "Guy Mollet", era: "IVe République", dates: "1905 – 1975", role: "Président du Conseil", quote: "Le socialisme réformateur face à la crise algérienne.", bio: "Secrétaire général de la SFIO et président du Conseil, impliqué dans la crise de Suez en 1956.", anecdote: "Il fut consprié par les colons d'Alger lors de sa fameuse visite en Algérie.", heritage: "Gestion controversée de la fin de l'Empire colonial.", tags: ["SFIO", "Suez", "Algérie"] },
            { name: "Pierre Pflimlin", era: "IVe République", dates: "1907 – 2000", role: "Président du Conseil", quote: "La dernière brique avant le retour du Général.", bio: "Dernier chef de gouvernement de la IVe République renversé par la crise d'Alger en mai 1958.", anecdote: "Il fut un fervent militant démocrate-chrétien et européen convaincu.", heritage: "Effacement pacifique du régime parlementaire instable.", tags: ["Crise d'Alger", "IVe République"] },

            // Ve République
            { name: "Charles de Gaulle", era: "Ve République", dates: "1890 – 1970", role: "Premier Président de la Ve République", quote: "Une certaine idée de la France.", bio: "Fondateur de la Ve République, il dota la France d'institutions stables et de l'arme nucléaire.", anecdote: "Il démissionna en 1969 après l'échec de son référendum sur la régionalisation.", heritage: "Stabilité constitutionnelle et indépendance géopolitique majeure.", tags: ["Ve République", "Président", "Indépendance"] },
            { name: "Georges Pompidou", era: "Ve République", dates: "1911 – 1974", role: "Président de la République", quote: "La France industrielle et moderne.", bio: "Premier ministre puis successeur de de Gaulle, il favorisa l'industrialisation rapide de la France.", anecdote: "Il était un grand amateur d'art contemporain et fit construire le centre culturel qui porte son nom.", heritage: "Modernisation urbaine et industrielle de la France des années 70.", tags: ["Président", "Centre Pompidou", "Industrie"] },
            { name: "Valéry Giscard d'Estaing", era: "Ve République", dates: "1926 – 2020", role: "Président de la République", quote: "Le changement dans la continuité.", bio: "Président libéral et réformateur, il abaissa la majorité à 18 ans et légiféra sur l'interruption volontaire de grossesse (IVG).", anecdote: "Il jouait de l'accordéon lors de ses campagnes électorales pour séduire les Français.", heritage: "Modernisation sociétale majeure de la France des années 70.", tags: ["Président", "IVG", "Majorité à 18 ans"] },
            { name: "François Mitterrand", era: "Ve République", dates: "1916 – 1996", role: "Président de la République", quote: "La force tranquille et l'abolition de la peine de mort.", bio: "Premier président socialiste de la Ve République (1981-1995), grand artisan de la construction européenne.", anecdote: "Il survécut à une double présidence de quatorze ans marquée par de grands travaux architecturaux.", heritage: "Abolition de la peine de mort et grands chantiers de Paris.", tags: ["Président", "Socialiste", "Peine de mort"] },
            { name: "Jacques Chirac", era: "Ve République", dates: "1932 – 2019", role: "Président de la République", quote: "Notre maison brûle et nous regardons ailleurs.", bio: "Président de la République, maire de Paris, il reconnut la responsabilité de l'État français dans la rafle du Vel d'Hiv.", anecdote: "Il vouait une passion immense pour les arts premiers et la cuisine de terroir.", heritage: "Refus de la guerre en Irak et conscience environnementale.", tags: ["Président", "Vel d'Hiv", "Irak"] },
            { name: "Nicolas Sarkozy", era: "Ve République", dates: "né en 1955", role: "Président de la République", quote: "Travailler plus pour gagner plus.", bio: "Président réformateur, partisan d'une rupture libérale et sécuritaire, retour de la France dans le commandement de l'OTAN.", anecdote: "Il mena une campagne présidentielle hyperactive et médiatique en 2007.", heritage: "Réformes institutionnelles et diplomatiques.", tags: ["Président", "Rupture", "OTAN"] },

        function toggleFavorite(name, event) {
            if (event) event.stopPropagation();
            if (favorites.includes(name)) {
                favorites = favorites.filter(f => f !== name);
            } else {
                favorites.push(name);
            }
            localStorage.setItem('hist_favorites', JSON.stringify(favorites));
            updateFavoritesCount();
            render();
        }

        function updateFavoritesCount() {
            document.getElementById('favorites-count').innerText = favorites.length;

            updateFavoritesCount();
            if (currentView === 'figures') {
                renderFigures();

                renderLexique();
            }

        function renderFigures() {
            const grid = document.getElementById('figures-grid');
            const emptyState = document.getElementById('empty-state');
            const countEl = document.getElementById('results-count');

            const filtered = rawDatabase.filter(fig => {
                const matchesEra = (currentEra === 'Toutes' || fig.era === currentEra);
                const matchesFav = (!showFavoritesOnly || favorites.includes(fig.name));
                const matchesSearch = searchQuery === '' || 
                    fig.name.toLowerCase().includes(searchQuery) ||
                    fig.role.toLowerCase().includes(searchQuery) ||
                    fig.bio.toLowerCase().includes(searchQuery) ||
                    fig.tags.some(t => t.toLowerCase().includes(searchQuery));
                return matchesEra && matchesFav && matchesSearch;
            });

            countEl.innerText = `${filtered.length} personnalité(s) affichée(s)`;

                grid.innerHTML = '';
                emptyState.classList.remove('hidden');

                        t.definition.toLowerCase().includes(searchQuery);
                });
                if (filteredTerms.length === 0) return null;
                totalTermsCount += filteredTerms.length;
                return { ...cat, terms: filteredTerms };
            }).filter(Boolean);

            countEl.innerText = `${totalTermsCount} terme(s) de lexique affiché(s)`;

            if (filteredCategories.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = filteredCategories.map(cat => `
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-2xs">
                    <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-bookmark text-amber-600 text-sm"></i> ${cat.name}
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${cat.terms.map(item => `
                            <div class="p-4 rounded-xl bg-slate-50 border border-slate-100 hover:border-amber-200 transition">
                                <h4 class="font-bold text-amber-900 text-sm mb-1">${item.term}</h4>
                                <p class="text-xs text-slate-600 leading-relaxed">${item.definition}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function openModal(name) {
            const fig = rawDatabase.find(f => f.name === name);
            if (!fig) return;

            document.getElementById('modal-era-badge').innerText = fig.era;
            document.getElementById('modal-dates').innerText = fig.dates;
            document.getElementById('modal-name').innerText = fig.name;
            document.getElementById('modal-role').innerText = fig.role;
            document.getElementById('modal-quote').innerText = fig.quote;
            document.getElementById('modal-bio').innerText = fig.bio;
            document.getElementById('modal-anecdote').innerText = fig.anecdote;
            document.getElementById('modal-heritage').innerText = fig.heritage;
            
            const tagsContainer = document.getElementById('modal-tags');
            tagsContainer.innerHTML = fig.tags.map(tag => `
                <span class="px-2.5 py-1 rounded-lg text-xs bg-slate-100 text-slate-600 font-medium">#${tag}</span>
            `).join('');

            updateModalFavBtn(fig.name);

            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
            document.body.style.overflow = 'hidden';
            selectedFigureIndex = fig.name;
        }

        function updateModalFavBtn(name) {
            const isFav = favorites.includes(name);
            const btn = document.getElementById('modal-fav-btn');
            btn.innerHTML = `<i class="${isFav ? 'fa-solid text-amber-600' : 'fa-regular'} fa-bookmark"></i>`;
        }

        function toggleFavoriteCurrentModal() {
            if (!selectedFigureIndex) return;
            toggleFavorite(selectedFigureIndex);
            updateModalFavBtn(selectedFigureIndex);
        }

        function closeModal() {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            document.body.style.overflow = '';
            selectedFigureIndex = null;
        }

        // Initialisation au chargement de la page
        window.addEventListener('DOMContentLoaded', () => {
            render();
        });

        // Fermeture du modal au clic en dehors
        document.getElementById('detail-modal').addEventListener('click', (e) => {
            if (e.target.id === 'detail-modal') closeModal();
        });
    </script>
</body>
</html>
