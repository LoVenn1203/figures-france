<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figures Historiques de France</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for horizontal filter bar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col font-sans antialiased selection:bg-amber-100 selection:text-amber-900">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetFilters()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-500 flex items-center justify-center text-white shadow-sm font-bold text-lg">
                    <i class="fa-solid fa-landmark"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-base sm:text-lg leading-tight">Figures de France</h1>
                    <p class="text-xs text-slate-500 hidden sm:block">179 destins qui ont façonné l'Histoire</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="favorites-toggle" onclick="toggleFavoritesFilter()" class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-700 bg-white hover:bg-slate-50 text-xs sm:text-sm font-medium transition">
                    <i class="fa-regular fa-bookmark text-amber-600"></i>
                    <span class="hidden sm:inline">Favoris</span>
                    <span id="favorites-count" class="bg-amber-100 text-amber-800 text-xs px-1.5 py-0.5 rounded-full font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <div class="bg-white border-b border-slate-200 py-3 shadow-2xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row gap-3 items-center justify-between">
            <!-- Search bar -->
            <div class="relative w-full sm:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="Rechercher une figure (ex: Napoléon, Jeanne...)" class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition">
            </div>
            
            <!-- Horizontal Eras Scroll -->
            <div class="w-full sm:w-auto overflow-x-auto no-scrollbar flex items-center space-x-2 py-1">
                <button onclick="filterByEra('Toutes')" id="era-btn-Toutes" class="era-tab px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap bg-slate-900 text-white transition">Toutes</button>
                <button onclick="filterByEra('Antiquité & Gaule')" id="era-btn-Antiquité & Gaule" class="era-tab px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Antiquité & Gaule</button>
                <button onclick="filterByEra('Moyen Âge')" id="era-btn-Moyen Âge" class="era-tab px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Moyen Âge</button>
                <button onclick="filterByEra('Renaissance & Ancien Régime')" id="era-btn-Renaissance & Ancien Régime" class="era-tab px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Renaissance & Ancien Régime</button>
                <button onclick="filterByEra('Révolution & Empire')" id="era-btn-Révolution & Empire" class="era-tab px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Révolution & Empire</button>
                <button onclick="filterByEra('XIXe Siècle')" id="era-btn-XIXe Siècle" class="era-tab px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition">XIXe Siècle</button>
                <button onclick="filterByEra('XXe Siècle & Époque Contemporaine')" id="era-btn-XXe Siècle & Époque Contemporaine" class="era-tab px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition">XXe Siècle & Contemporain</button>
            </div>
        </div>
    </div>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div id="results-count" class="text-xs font-medium text-slate-500 mb-4">Affichage de 179 figures historiques</div>
        
        <!-- Grid layout: 2 columns on mobile, up to 4 on desktop -->
        <div id="figures-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
            <!-- Cards injected via JavaScript -->
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 px-4 text-center">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 text-xl mb-3">
                <i class="fa-solid fa-face-frown"></i>
            </div>
            <h3 class="text-base font-semibold text-slate-800">Aucune figure historique trouvée</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-sm">Essayez de modifier vos termes de recherche ou de réinitialiser les filtres d'époque.</p>
            <button onclick="resetFilters()" class="mt-4 px-4 py-2 bg-amber-600 text-white rounded-xl text-xs font-medium hover:bg-amber-700 transition">Réinitialiser les filtres</button>
        </div>
    </main>

    <div id="detail-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div id="modal-content" class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-xl transform scale-95 transition-transform duration-200 flex flex-col">
            <!-- Modal header -->
            <div class="sticky top-0 bg-white border-b border-slate-100 px-6 py-4 flex items-center justify-between z-10">
                <div class="flex items-center space-x-3">
                    <span id="modal-era-badge" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200"></span>
                    <span id="modal-dates" class="text-xs text-slate-500 font-medium"></span>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="modal-fav-btn" onclick="toggleFavoriteCurrentModal()" class="w-9 h-9 rounded-xl border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 transition">
                        <i class="fa-regular fa-bookmark"></i>
                    </button>
                    <button onclick="closeModal()" class="w-9 h-9 rounded-xl border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            
            <!-- Modal body -->
            <div class="p-6 space-y-6">
                <div>
                    <h2 id="modal-name" class="text-2xl font-bold text-slate-900"></h2>
                    <p id="modal-role" class="text-sm font-medium text-amber-700 mt-0.5"></p>
                </div>

                <div class="bg-amber-50/50 border border-amber-100 rounded-xl p-4 italic text-sm text-amber-900 relative">
                    <i class="fa-solid fa-quote-left text-amber-300 text-lg absolute top-2 left-2 -z-0 opacity-50"></i>
                    <p id="modal-quote" class="relative z-10 pl-4"></p>
                </div>

                <div>
                    <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Biographie & Rôle historique</h4>
                    <p id="modal-bio" class="text-sm text-slate-600 leading-relaxed"></p>
                </div>

                <div>
                    <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Faits marquants</h4>
                    <ul id="modal-achievements" class="space-y-2 text-sm text-slate-600">
                        <!-- Injected achievements list -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

            { id: 32, name: "Philippe IV le Bel", era: "Moyen Âge", dates: "1268 – 1314", role: "Roi de France", bio: "Souverain autoritaire qui renforça l'État moderne, créa les États généraux et dissout l'ordre des Templiers.", quote: "Le roi ne tient son pouvoir que de Dieu et de son épée.", achievements: ["Création des États Généraux (1302)", "Dissolution de l'ordre du Temple", "Création de la chambre des comptes"] },
            { id: 33, name: "Guillaume de Nogaret", era: "Moyen Âge", dates: "1260 – 1313", role: "Conseiller de Philippe le Bel", bio: "Juriste redoutable, artisan de la laïcisation de l'État royal et de l'affirmation de la souveraineté face à la papauté.", quote: "La loi du roi prime sur toute autre autorité terrestre.", achievements: ["Affrontement avec le pape Boniface VIII", "Arrestation des Templiers", "Renforcement de la justice royale"] },
            { id: 34, name: "Charles V le Sage", era: "Moyen Âge", dates: "1338 – 1380", role: "Roi de France", bio: "Souverain érudit qui redressa militairement la France au début de la guerre de Cent Ans et fonda la première bibliothèque royale au Louvre.", quote: "L'art de régner réside dans la science et la mesure.", achievements: ["Redressement de la guerre de Cent Ans", "Fondation de la bibliothèque du Louvre", "Stabilisation de la monnaie"] },
            { id: 35, name: "Bertrand du Guesclin", era: "Moyen Âge", dates: "1320 – 1380", role: "Connétable de France", bio: "Brillant stratège de la guerre de Cent Ans, il chassa méthodiquement les Anglais du sol français grâce à la tactique de la terre déserte.", quote: "Je moururai en combattant les ennemis de la couronne.", achievements: ["Victoires majeures contre les Anglais", "Titre de Connétable de France", "Libération d'une grande partie du territoire"] },
            { id: 36, name: "Christine de Pizan", era: "Moyen Âge", dates: "1364 – 1430", role: "Écrivaine et philosophe", bio: "Considérée comme la première femme de lettres française à vivre de sa plume, pionnière du féminisme et de la défense des femmes.", quote: "Homme ou femme, l'esprit n'a point de sexe.", achievements: ["Rédaction de La Cité des dames", "Œuvres poétiques et politiques", "Pionnière de l'humanisme littéraire"] },
            { id: 37, name: "Jeanne d'Arc", era: "Moyen Âge", dates: "1412 – 1431", role: "Héroïne nationale et cheffe de guerre", bio: "La Pucelle d'Orléans redonna espoir à la France pendant la guerre de Cent Ans, fit sacrer Charles VII à Reims avant de mourir sur le bûcher à Rouen.", quote: "Les hommes bataillent, mais c'est Dieu qui donne la victoire.", achievements: ["Levée du siège d'Orléans (1429)", "Sacre de Charles VII à Reims", "Symbole éternel de la résistance française"] },
            { id: 38, name: "Charles VII le Victorieux", era: "Moyen Âge", dates: "1403 – 1461", role: "Roi de France", bio: "Il acheva la reconquête de la France face aux Anglais à la fin de la guerre de Cent Ans et créa la première armée permanente moderne.", quote: "La patrie triomphe enfin de ses divisions.", achievements: ["Fin de la guerre de Cent Ans (1453)", "Création des compagnies d'ordonnance", "Institution de la Pragmatic Sanction"] },
            { id: 39, name: "Jacques Coeur", era: "Moyen Âge", dates: "1395 – 1456", role: "Grand argentier du roi", bio: "Marchand visionnaire et financier de Charles VII, il développa le commerce maritime international et fit fortune en Orient.", quote: "À cœur vaillant rien d'impossible, à marchand hardi tout profit.", achievements: ["Création d'une flotte marchande française", "Financement de la reconquête normande", "Construction du palais de Bourges"] },
            { id: 40, name: "Louis XI", era: "Moyen Âge", dates: "1423 – 1483", role: "Roi de France (l'Universelle Aragne)", bio: "Souverain rusé et pragmatique, il brisa la puissance des grands ducs de Bourgogne (notamment Charles le Téméraire) et unifia le territoire national.", quote: "Diviser pour régner est la sagesse des rois.", achievements: ["Annexion de la Bourgogne et de la Provence", "Développement des postes royales", "Affermissement définitif de l'État moderne"] },
            
            // Renaissance & Ancien Régime
            { id: 41, name: "François Ier", era: "Renaissance & Ancien Régime", dates: "1494 – 1547", role: "Roi de France et protecteur des arts", bio: "Souverain emblématique de la Renaissance française, mécène de Léonard de Vinci, vainqueur à Marignan et bâtisseur de châteaux.", quote: "Tout est perdu fors l'honneur.", achievements: ["Introduction de la Renaissance en France", "Fondation du Collège de France", "Ordonnance de Villers-Cotterêts (1539)"] },
            { id: 42, name: "Léonard de Vinci", era: "Renaissance & Ancien Régime", dates: "1452 – 1519", role: "Peintre, inventeur et génie universel", bio: "Invité par François Ier à Amboise, il passa ses dernières années au château du Clos Lucé, apportant son génie visionnaire à la cour de France.", quote: "La simplicité est la sophistication suprême.", achievements: ["Chef-d'œuvre de la Joconde apporté en France", "Études d'ingénierie et d'architecture", "Projets de la cité idéale de Romorantin"] },
            { id: 43, name: "Marguerite de Navarre", era: "Renaissance & Ancien Régime", dates: "1492 – 1549", role: "Reine de Navarre et femme de lettres", bio: "Sœur de François Ier, protectrice des humanistes et des réformateurs, autrice du fameux recueil de nouvelles L'Heptaméron.", quote: "L'amour de la vérité éclaire l'esprit.", achievements: ["Rédaction de L'Heptaméron", "Soutien aux intellectuels persécutés", "Diplomatie humaniste"] },
            { id: 44, name: "Ambroise Paré", era: "Renaissance & Ancien Régime", dates: "1510 – 1590", role: "Chirurgien et anatomiste", bio: "Père de la chirurgie moderne, il révolutionna les pratiques médicales sur les champs de bataille en abandonnant la cautérisation au fer rouge.", quote: "Je le pansai, Dieu le guérit.", achievements: ["Invention de la ligature des artères", "Amélioration des prothèses chirurgicales", "Chirurgien de quatre rois de France"] },
            { id: 45, name: "Michel de L'Hospital", era: "Renaissance & Ancien Régime", dates: "1505 – 1573", role: "Chancelier de France", bio: "Humaniste et grand défenseur de la tolérance civile durant les guerres de Religion, prônant la concorde entre catholiques et protestants.", quote: "Oublions ces mots diaboliques de partis : luthériens, huguenots, catholiques.", achievements: ["Édit de Romorantin", "Pacification mesurée des tensions religieuses", "Défense de l'indépendance de la justice"] },
            { id: 46, name: "Nostradamus", era: "Renaissance & Ancien Régime", dates: "1503 – 1566", role: "Apothicaire et astrologue", bio: "Médecin et auteur des célèbres Centuries, prophéties énigmatiques qui traversèrent les siècles.", quote: "Le futur se lit dans la trame du présent.", achievements: ["Publication des Prophéties (1555)", "Soins durant les épidémies de peste", "Médecin ordinaire du roi"] },
            { id: 47, name: "Catherine de Médicis", era: "Renaissance & Ancien Régime", dates: "1519 – 1589", role: "Reine mère et régente de France", bio: "Figure centrale des guerres de Religion, elle gouverna la France avec un grand sens politique au milieu des factions rivales.", quote: "Il faut savoir plier le genou quand la tempête est trop forte.", achievements: ["Mécénat artistique (palais des Tuileries)", "Tentatives de conciliation religieuse", "Préservation de la dynastie des Valois"] },
            { id: 48, name: "Michel de Montaigne", era: "Renaissance & Ancien Régime", dates: "1533 – 1592", role: "Philosophe et essayiste", bio: "Père de l'essai moderne, maire de Bordeaux, explorateur de la condition humaine dans son chef-d'œuvre Les Essais.", quote: "Que sais-je ?", achievements: ["Rédaction des Essais", "Humanisme sceptique et tolérant", "Réflexion sur l'éducation et l'altérité"] },
            { id: 49, name: "Henri IV", era: "Renaissance & Ancien Régime", dates: "1553 – 1610", role: "Roi de France et de Navarre", bio: "Le Bon Roi Henri mit fin aux guerres de Religion en signant l'édit de Nantes en 1598 et veilla au bien-être de ses sujets.", quote: "Si Dieu me prête vie, je ferai qu'il n'y aura point laboureur en mon royaume qui n'ait les moyens d'avoir une poule dans son pot.", achievements: ["Édit de Nantes (1598)", "Rétablissement de l'économie et de l'agriculture", "Construction de la place des Vosges"] },
            { id: 50, name: "Maximilien de Béthune (Sully)", era: "Renaissance & Ancien Régime", dates: "1560 – 1641", role: "Ministre d'Henri IV", bio: "Duc et pair, grand argentier du royaume, il assainit les finances publiques et développa l'agriculture (« Labourage et pâturage sont les deux mamelles de la France »).", quote: "Labourage et pâturage sont les deux mamelles de la France.", achievements: ["Assainissement de la dette royale", "Développement des grands axes routiers et canaux", "Réorganisation des fortifications"] },
            { id: 51, name: "François de Malherbe", era: "Renaissance & Ancien Régime", dates: "1555 – 1628", role: "Poète et grammairien", bio: "Réformateur rigoureux de la langue et de la versification françaises, instaurant clarté et mesure classique.", quote: "Enfin Malherbe vint, et, premier en France, fit sentir dans les vers une juste cadence.", achievements: ["Codification de la poésie classique", "Rigueur grammaticale", "Soutien à la création littéraire"] },
            { id: 52, name: "Le Caravage", era: "Renaissance & Ancien Régime", dates: "1571 – 1610", role: "Peintre visionnaire", bio: "Maître du clair-obscur, réfugié à la fin de sa vie à Malte et en Sicile, son influence marqua durablement la peinture française du XVIIe siècle.", quote: "La lumière naît toujours de l'ombre la plus profonde.", achievements: ["Révolution du clair-obscur", "Réalisme pictural percutant", "Influence sur les peintres caravagesques français"] },
            { id: 53, name: "Louis XIII", era: "Renaissance & Ancien Régime", dates: "1601 – 1643", role: "Roi de France", bio: "Souverain travailleur et pieux, il s'allia durablement avec le cardinal de Richelieu pour affirmer l'autorité royale en France et en Europe.", quote: "Le service de l'État passe avant toute affection personnelle.", achievements: ["Prise de La Rochelle", "Création de l'Académie française", "Renforcement de l'État central"] },
            { id: 54, name: "Cardinal de Richelieu", era: "Renaissance & Ancien Régime", dates: "1585 – 1642", role: "Principal ministre de Louis XIII", bio: "L'Éminence rouge consolida l'absolutisme monarchique, affaiblit la noblesse rebelle et les protestants, et fonda l'Académie française.", quote: "Le pouvoir politique exige fermeté et raison d'État.", achievements: ["Fondation de l'Académie française", "Soumission de la noblesse frondeuse", "Affirmation de la puissance française en Europe"] },
            { id: 55, name: "René Descartes", era: "Renaissance & Ancien Régime", dates: "1596 – 1650", role: "Philosophe et mathématicien", bio: "Père de la philosophie moderne et de la géométrie analytique, il révolutionna la pensée par le doute méthodique.", quote: "Je pense, donc je suis.", achievements: ["Discours de la méthode", "Invention du repère cartésien", "Révolution philosophique du rationalisme"] },
            { id: 56, name: "Pierre Corneille", era: "Renaissance & Ancien Régime", dates: "1606 – 1684", role: "Dramaturge et poète", bio: "Auteur du Cid et de tragédies flamboyantes exaltant la volonté humaine, l'honneur et le dépassement de soi.", quote: "À vaincre sans péril, on triomphe sans gloire.", achievements: ["Création du chef-d'œuvre Le Cid", "Renouvellement de la tragédie classique", "Élection à l'Académie française"] },
            { id: 57, name: "Blaise Pascal", era: "Renaissance & Ancien Régime", dates: "1623 – 1662", role: "Mathématicien, physicien et philosophe", bio: "Génie précoce, inventeur de la première machine à calculer, physicien de la pression atmosphérique et auteur des Provinciales et des Pensées.", quote: "L'homme n'est qu'un roseau, le plus faible de la nature; mais c'est un roseau pensant.", achievements: ["Invention de la machine arithmétique (la pascaline)", "Démonstration de la pression atmosphérique", "Les Pensées et Les Provinciales"] },
            { id: 58, name: "Cyrano de Bergerac", era: "Renaissance & Ancien Régime", dates: "1619 – 1655", role: "Écrivain et bretteur", bio: "Libertin audacieux, précurseur de la science-fiction avec ses récits de voyages sur la Lune et le Soleil.", quote: "C'est un roc ! C'est un pic ! C'est un cap ! Que dis-je, c'est un cap ? C'est une péninsule !", achievements: ["Voyages comiques aux États et Empires de la Lune", "Œuvres théâtrales satiriques", "Esprit frondeur et indépendant"] },
            { id: 59, name: "Cardinal Mazarin", era: "Renaissance & Ancien Régime", dates: "1602 – 1661", role: "Principal ministre sous la régence d'Anne d'Autriche", bio: "Fin diplomate italien, il négocia les traités de Westphalie et surmonta les redoutables troubles de la Fronde.", quote: "Le temps et moi en valons bien un autre.", achievements: ["Traités de Westphalie (1648)", "Victoire sur la Fronde", "Constitution d'une immense collection d'art"] },
            { id: 60, name: "Nicolas Poussin", era: "Renaissance & Ancien Régime", dates: "1594 – 1665", role: "Peintre classique", bio: "Maître absolu du classicisme pictural français, inspiré par l'Antiquité et la rigueur de la composition.", quote: "La peinture n'est point un vain amusement, c'est une noble science.", achievements: ["Chefs-d'œuvre du classicisme (Les Bergers d'Arcadie)", "Influence majeure sur l'Académie royale", "Maîtrise de la lumière et du dessin"] },
            { id: 61, name: "Molière (Jean-Baptiste Poquelin)", era: "Renaissance & Ancien Régime", dates: "1622 – 1673", role: "Dramaturge et comédien", bio: "Le plus grand auteur comique français, il croqua les travers de la société de son temps avec génie dans Le Tartuffe, L'Avare ou Le Misanthrope.", quote: "Le théâtre est un miroir des mœurs.", achievements: ["Création de la Comédie-Française (troupe)", "Chefs-d'œuvre immortels de la comédie", "Critique sociale incisive et subtile"] },
            { id: 62, name: "Jean Racine", era: "Renaissance & Ancien Régime", dates: "1639 – 1699", role: "Dramaturge tragique", bio: "Maître incontesté de la tragédie classique, explorateur des passions amoureuses et destructrices dans Phèdre, Andromaque ou Britannicus.", quote: "La passion fait souffrir, mais elle révèle l'âme humaine.", achievements: ["Chefs-d'œuvre de la tragédie classique", "Historiographe du roi Louis XIV", "Perfection de l'alexandrin tragique"] },
            { id: 63, name: "Jean de La Fontaine", era: "Renaissance & Ancien Régime", dates: "1621 – 1695", role: "Poète et fabuliste", bio: "Immortaliser les animaux pour instruire les hommes à travers ses célèbres Fables pleines de sagesse et d'ironie.", quote: "Rien ne sert de courir ; faut partir à point.", achievements: ["Publication des Fables immortelles", "Chef-d'œuvre de la poésie narrative", "Élection à l'Académie française"] },
            { id: 64, name: "Louis XIV (Le Roi-Soleil)", era: "Renaissance & Ancien Régime", dates: "1638 – 1715", role: "Roi de France", bio: "Symbole de l'absolutisme triomphant, il fit construire le somptueux château de Versailles et porta la France au zénith de son rayonnement culturel.", quote: "L'État, c'est moi.", achievements: ["Construction du château de Versailles", "Apogée du Grand Siècle et des arts", "Extension territoriale du royaume"] },
            { id: 65, name: "Jean-Baptiste Colbert", era: "Renaissance & Ancien Régime", dates: "1619 – 1683", role: "Ministre des Finances et de la Marine", bio: "Architecte du mercantilisme (le colbertisme), il développa les manufactures royales, la marine de guerre et le commerce colonial.", quote: "Le commerce est la source de la puissance financière de l'État.", achievements: ["Création des manufactures royales (Gobelins)", "Réforme du code noir et de la justice", "Développement de la marine et des colonies"] },
            { id: 66, name: "Sébastien Le Prestre de Vauban", era: "Renaissance & Ancien Régime", dates: "1633 – 1707", role: "Maréchal de France et architecte militaire", bio: "Génie des fortifications, il ceintura la France de son « Ceinture de fer » imprenable et proposa la Dîme royale pour plus d'équité.", quote: "Ville assiégée, ville prise.", achievements: ["Réseau de fortifications classé à l'UNESCO", "Invention de la méthode de siège par tranchées", "Traité de la Dîme royale"] },
            { id: 67, name: "Charles Perrault", era: "Renaissance & Ancien Régime", dates: "1628 – 1703", role: "Écrivain et conteur", bio: "Il figea pour l'éternité les contes populaires de notre enfance : Le Cendrillon, Le Petit Chaperon rouge, Le Chat botté.", quote: "La beauté des contes réside dans la vérité cachée de leurs morales.", achievements: ["Publication des Contes de ma mère l'Oye", "Querelle des Anciens et des Modernes", "Académicien et bâtisseur"] },
            { id: 68, name: "Madame de Sévigné", era: "Renaissance & Ancien Régime", dates: "1626 – 1696", role: "Écrivaine épistolière", bio: "Ses célèbres Lettres à sa fille constituent un témoignage littéraire unique et raffiné sur la vie mondaine sous Louis XIV.", quote: "Les lettres sont l'image de l'entretien des absents.", achievements: ["Chef-d'œuvre de la littérature épistolaire", "Peinture exquise de la société classique", "Style vif et spirituel"] },
            { id: 69, name: "André Le Nôtre", era: "Renaissance & Ancien Régime", dates: "1613 – 1700", role: "Jardinier et paysagiste du roi", bio: "Créateur des somptueux jardins à la française, notamment ceux de Versailles, de Vaux-le-Vicomte et des Tuileries.", quote: "La nature ordonnée par l'esprit devient un chef-d'œuvre.", achievements: ["Conception des jardins de Versailles", "Maîtrise de la perspective paysagère", "Modèle universel d'art des jardins"] },
            { id: 70, name: "Jean-Baptiste Lully", era: "Renaissance & Ancien Régime", dates: "1632 – 1687", role: "Compositeur et surintendant de la musique", bio: "Créateur de la tragédie lyrique française et codirecteur de l'Opéra, il façonna la musique de la cour de Louis XIV.", quote: "La musique exprime ce que les mots ne peuvent taire.", achievements: ["Création de la tragédie en musique", "Collaboration étroite avec Molière", "Direction de la Musique de la Chambre"] },
            { id: 71, name: "François de Salignac de La Mothe-Fénelon", era: "Renaissance & Ancien Régime", dates: "1651 – 1715", role: "Archevêque et écrivain", bio: "Précepteur du duc de Bourgogne, auteur des Aventures de Télémaque, critique clairvoyant de l'absolutisme excessif de Louis XIV.", quote: "Un peuple ruiné ne fait plus de sujets fidèles.", achievements: ["Rédaction des Aventures de Télémaque", "Pédagogie novatrice pour les princes", "Défense des humbles et de la paix"] },
            { id: 72, name: "Antoine Galland", era: "Renaissance & Ancien Régime", dates: "1646 – 1715", role: "Orientaliste et numismate", bio: "Il offrit à l'Europe la première traduction des Mille et Une Nuits, ouvrant l'imaginaire occidental aux splendeurs de l'Orient.", quote: "Le conte enchante l'esprit et abolit les frontières.", achievements: ["Traduction majeure des Mille et Une Nuits", "Introduction du conte oriental en Occident", "Recherche archéologique"] },
            { id: 73, name: "Maréchal de Villars", era: "Renaissance & Ancien Régime", dates: "1653 – 1734", role: "Général et maréchal de France", bio: "Brillant commandant militaire qui sauva la France de l'invasion à la fin du règne de Louis XIV grâce à la victoire de Denain.", quote: "Audace et constance triomphent du nombre.", achievements: ["Victoire décisive de Denain (1712)", "Défense des frontières du royaume", "Dernier grand maréchal du Roi-Soleil"] },
            { id: 74, name: "Montesquieu (Charles de Secondat)", era: "Renaissance & Ancien Régime", dates: "1689 – 1755", role: "Philosophe et écrivain politique", bio: "Penseur majeur des Lumières, théoricien de la séparation des pouvoirs (législatif, exécutif, judiciaire) dans De l'esprit des lois.", quote: "Pour qu'on ne puisse abuser du pouvoir, il faut que, par la disposition des choses, le pouvoir arrête le pouvoir.", achievements: ["Théorie de la séparation des pouvoirs", "Les Lettres persanes", "Fondement des démocraties modernes"] },
            { id: 75, name: "Voltaire (François-Marie Arouet)", era: "Renaissance & Ancien Régime", dates: "1694 – 1778", role: "Philosophe et chef de file des Lumières", bio: "Défenseur acharné de la liberté d'expression, de la tolérance et combattant de l'intolérance religieuse (affaire Calas).", quote: "Je ne suis pas d'accord avec ce que vous dites, mais je battrai jusqu'à la mort pour que vous puissiez le dire.", achievements: ["Combat contre l'intolérance et le fanatisme", "Œuvre philosophique immense (Candide)", "Défense des victimes d'erreurs judiciaires"] },
            { id: 76, name: "Émilie du Châtelet", era: "Renaissance & Ancien Régime", dates: "1706 – 1749", role: "Mathématicienne et physicienne", bio: "Femme de science d'exception, traductrice et commentatrice des Principia mathematica de Newton en français.", quote: "J'ai besoin d'étudier pour vivre heureuse.", achievements: ["Traduction de Newton toujours référence", "Travaux sur la nature du feu et de l'énergie", "Pionnière des sciences physiques"] },
            { id: 77, name: "Jean-Jacques Rousseau", era: "Renaissance & Ancien Régime", dates: "1712 – 1778", role: "Philosophe et écrivain", bio: "Penseur du contrat social, de la souveraineté du peuple et de l'éducation naturelle (Émile), figure majeure des Lumières.", quote: "L'homme est né libre, et partout il est dans les fers.", achievements: ["Du contrat social", "Les Confessions", "Réflexion moderne sur la pédagogie et la démocratie"] },
            { id: 78, name: "Denis Diderot", era: "Renaissance & Ancien Régime", dates: "1713 – 1784", role: "Philosophe et encyclopédiste", bio: "Directeur de la monumentale Encyclopédie avec D'Alembert, œuvre maîtresse de la diffusion des savoirs des Lumières.", quote: "Il est important de tout examiner, de tout remuer sans exception ni ménagement.", achievements: ["Direction de l'Encyclopédie", "Renouvellement de la critique d'art", "Philosophie matérialiste et audacieuse"] },
            { id: 79, name: "Jean le Rond d'Alembert", era: "Renaissance & Ancien Régime", dates: "1717 – 1783", role: "Mathématicien et philosophe", bio: "Co-directeur de l'Encyclopédie, éminent mathématicien et physicien, académicien influent.", quote: "La raison est à l'esprit ce que la lumière est aux yeux.", achievements: ["Discours préliminaire de l'Encyclopédie", "Travaux sur les équations différentielles", "Secrétaire perpétuel de l'Académie française"] },
            { id: 80, name: "Georges-Louis Leclerc de Buffon", era: "Renaissance & Ancien Régime", dates: "1707 – 1788", role: "Naturaliste et biologiste", bio: "Auteur de la monumentale Histoire naturelle, générale et particulière, qui popularisa la science de la nature au XVIIIe siècle.", quote: "Le style est l'homme même.", achievements: ["Rédaction de l'Histoire naturelle", "Direction du Jardin du Roi", "Pionnier de la géologie historique"] },
            { id: 81, name: "Madame de Pompadour", era: "Renaissance & Ancien Régime", dates: "1721 – 1764", role: "Favorite et mécène de Louis XV", bio: "Femme d'influence politique et grande protectrice des arts, des lettres (les Encyclopédistes) et de la manufacture de Sèvres.", quote: "Le goût des arts est l'âme d'une nation civilisée.", achievements: ["Soutien actif aux Encyclopédistes", "Développement de la porcelaine de Sèvres", "Mécénat architectural et pictural"] },
            { id: 82, name: "Pierre Beaumarchais", era: "Renaissance & Ancien Régime", dates: "1732 – 1799", role: "Dramaturge, espion et aventurier", bio: "Auteur des pièces immortelles Le Barbier de Séville et Le Mariage de Figaro, qui annoncèrent l'esprit frondeur de la Révolution.", quote: "Sans la liberté de blâmer, il n'est point d'éloge flatteur.", achievements: ["Le Mariage de Figaro", "Soutien logistique secret aux insurgés américains", "Fondation de la société des auteurs"] },
            { id: 83, name: "Louis XVI", era: "Renaissance & Ancien Régime", dates: "1754 – 1793", role: "Roi de France", bio: "Dernier monarque de l'Ancien Régime, homme instruit mais dépassé par l'effervescence de la Révolution française.", quote: "Je meurs innocent de tous les crimes qu'on m'impure.", achievements: ["Soutien à l'indépendance américaine", "Tentatives de réformes financières (Turgot, Necker)", "Convocation des États généraux"] },
            { id: 84, name: "Marie-Antoinette", era: "Renaissance & Ancien Régime", dates: "1755 – 1793", role: "Reine de France", bio: "Archiduchesse d'Autriche devenue reine de France, tragiquement emportée par la tourmente révolutionnaire.", quote: "Courage, j'ai traversé bien des épreuves pour en arriver là.", achievements: ["Icône de la mode et des arts de cour", "Aménagement du Hameau de la Reine", "Dignité lors de son procès et de son supplice"] },
            { id: 85, name: "Antoine Laurent de Lavoisier", era: "Renaissance & Ancien Régime", dates: "1743 – 1794", role: "Chimiste et père de la chimie moderne", bio: "Il découvrit le rôle de l'oxygène dans la combustion, réfuta la théorie du phlogistique et posa les bases de la nomenclature chimique moderne.", quote: "Rien ne se perd, rien ne se crée, tout se transforme.", achievements: ["Fondation de la chimie moderne", "Loi de conservation de la masse", "Création du système métrique"] },
            { id: 86, name: "Marquis de Lafayette", era: "Renaissance & Ancien Régime", dates: "1757 – 1834", role: "Héros des deux mondes et général", bio: "Engagé dans la guerre d'indépendance américaine, commandant de la Garde nationale française, artisan de la Déclaration des droits de l'homme.", quote: "Pour qu'une nation soit libre, il suffit qu'elle le veuille.", achievements: ["Engagement dans la guerre d'indépendance américaine", "Co-rédaction de la Déclaration des droits de l'homme", "Commandement de la Garde nationale"] },
            { id: 87, name: "Jean-Paul Marat", era: "Renaissance & Ancien Régime", dates: "1743 – 1793", role: "Révolutionnaire et journaliste", bio: "Surnommé l'Ami du peuple, ardent tribun radical de la Révolution française, assassiné dans sa baignoire par Charlotte Corday.", quote: "Il faut abattre la tête des tyrans pour sauver la République.", achievements: ["Journal L'Ami du peuple", "Rôle central au club des Cordeliers", "Figure radicale de la Terreur"] },
            { id: 88, name: "Olympe de Gouges", era: "Renaissance & Ancien Régime", dates: "1748 – 1793", role: "Femme de lettres et féministe", bio: "Pionnière du féminisme français, autrice de la Déclaration des droits de la femme et de la citoyenne en 1791.", quote: "La femme a le droit de monter à l'échafaud ; elle doit avoir de même celui de monter à la tribune.", achievements: ["Rédaction de la Déclaration des droits de la femme", "Combats contre l'esclavage des Noirs", "Écrits politiques engagés"] },
            { id: 89, name: "Maximisation de Robespierre", era: "Révolution & Empire", dates: "1758 – 1794", role: "Avocat et homme politique révolutionnaire", bio: "Figure centrale et controversée de la Révolution, surnommé l'Incorruptible, artisan principal de la période de la Terreur.", quote: "Le gouvernement de la République est le despotisme de la liberté contre la tyrannie.", achievements: ["Rôle clé au Comité de salut public", "Abolition de l'esclavage dans les colonies (1794)", "Fermeté républicaine absolue"] },
            { id: 90, name: "Georges Jacques Danton", era: "Révolution & Empire", dates: "1759 – 1794", role: "Ministre de la Justice et tribun", bio: "Orateur enflammé de la Révolution, il galvanisa les troupes en 1792 face aux armées coalisées (« De l'audace, encore de l'audace, toujours de l'audace »).", quote: "De l'audace, encore de l'audace, toujours de l'audace, et la France est sauvée !", achievements: ["Création du Tribunal révolutionnaire", "Mobilisation générale de 1792", "Discours mémorables de la Convention"] },
            { id: 91, name: "Camille Desmoulins", era: "Révolution & Empire", dates: "1760 – 1794", role: "Journaliste et révolutionnaire", bio: "Il appela le peuple aux armes au Palais-Royal le 12 juillet 1789, brandissant une feuille d'arbre comme cocarde.", quote: "Aux armes ! Citoyens, formez vos bataillons !", achievements: ["Appel à la prise de la Bastille", "Journal Le Vieux Cordelier", "Plaidoyer pour la clémence à la fin de sa vie"] },
            { id: 92, name: "Lazare Carnot", era: "Révolution & Empire", dates: "1753 – 1823", role: "Organisateur de la victoire", bio: "Mathématicien et général, il organisa les armées de la République qui repoussèrent victorieusement les coalitions européennes.", quote: "L'organisation est la clé de la victoire.", achievements: ["Levée en masse des armées révolutionnaires", "Victoires de la Ire République", "Membre du Directoire"] },
            { id: 93, name: "Joseph-Ignace Guillotin", era: "Révolution & Empire", dates: "1738 – 1814", role: "Médecin et député", bio: "Il proposa l'usage d'une machine de décapitation humanitaire pour garantir l'égalité des peines sans distinction de classe sociale.", quote: "Avec ma machine, je vous fais sauter la tête en un clin d'œil, et vous ne souffrez point.", achievements: ["Introduction de la guillotine humanitaire", "Député aux États généraux", "Travaux sur la santé publique"] },
            { id: 94, name: "Jacques-Louis David", era: "Révolution & Empire", dates: "1748 – 1825", role: "Peintre néoclassique", bio: "Peintre officiel de la Révolution puis de Napoléon, immortalisant Le Serment des Horaces, La Mort de Marat et Le Sacre de Napoléon.", quote: "L'art doit élever l'âme et célébrer la grandeur civique.", achievements: ["Chefs-d'œuvre du néoclassicisme", "Immortalisation de l'épopée napoléonienne", "Réorganisation des beaux-arts"] },
            { id: 95, name: "Napoléon Bonaparte", era: "Révolution & Empire", dates: "1769 – 1821", role: "Général, Consul puis Empereur des Français", bio: "Chef militaire hors du pair, il modernisa l'administration française (Code civil, lycées, préfectures) et bâtit un vaste empire européen.", quote: "Impossible n'est pas français.", achievements: ["Création du Code civil (Code Napoléon)", "Victoires éclatantes (Austerlitz, Iéna)", "Modernisation institutionnelle de la France"] },
            { id: 96, name: "Joséphine de Beauharnais", era: "Révolution & Empire", dates: "1763 – 1814", role: "Impératrice des Français", bio: "Première épouse de Napoléon Ier, reine d'élégance et de grâce, qui fit de la Malmaison un haut lieu des arts et de la botanique.", quote: "L'élégance est l'art de ne point se faire remarquer tout en marquant les esprits.", achievements: ["Influence majeure sur la mode néoclassique", "Collection botanique rare à la Malmaison", "Soutien constant à l'Empereur"] },
            { id: 97, name: "Maréchal Ney", era: "Révolution & Empire", dates: "1769 – 1815", role: "Maréchal d'Empire (Le Brave des Braves)", bio: "Légendaire pour son intrépidité au combat, il commanda l'arrière-garde lors de la désastreuse campagne de Russie.", quote: "Venez voir comment meurt un maréchal de France !", achievements: ["Héroïsme à Eylau et Moskowa", "Titre de Prince de la Moskowa", "Commandement de la Garde impériale"] },
            { id: 98, name: "Jean-Baptiste Bernadotte", era: "Révolution & Empire", dates: "1763 – 1844", role: "Maréchal d'Empire puis Roi de Suède", bio: "De simple soldat à maréchal, il devint roi de Suède et de Norvège sous le nom de Charles XIV Jean.", quote: "Le destin sourit à ceux qui savent saisir l'instant.", achievements: ["Carrière militaire fulgurante", "Fondation de la dynastie royale suédoise actuelle", "Victoires de la coalition contre Napoléon"] },
            { id: 99, name: "François-René de Chateaubriand", era: "XIXe Siècle", dates: "1768 – 1848", role: "Écrivain et diplomate", bio: "Père du romantisme français, auteur des Mémoires d'outre-tombe et du Génie du christianisme, voyageur et visionnaire.", quote: "Mon pays est partout où il y a de la grandeur et de la liberté.", achievements: ["Mémoires d'outre-tombe", "Renaissance du sentiment romantique", "Ambassadeur et ministre des Affaires étrangères"] },
            { id: 100, name: "Germaine de Staël (Madame de Staël)", era: "XIXe Siècle", dates: "1766 – 1817", role: "Romancière et essayiste", bio: "Intellectuelle brillante, opposante farouche au despotisme napoléonien, elle introduisit le romantisme en Europe par ses essais sur l'Allemagne.", quote: "La liberté est le premier des biens, la source de tous les talents.", achievements: ["Diffusion des idées romantiques en Europe", "Salon littéraire influent de Coppet", "Essais littéraires novateurs"] },
            { id: 101, name: "Louis XVIII", era: "XIXe Siècle", dates: "1755 – 1824", role: "Roi de France", bio: "Souverain de la Restauration, il octroya la Charte constitutionnelle de 1814 cherchant à concilier l'Ancien Régime et les acquis de la Révolution.", quote: "L'union et l'oubli sont les seuls voeux que je forme pour la France.", achievements: ["Octroi de la Charte de 1814", "Retour à la paix civile après l'Empire", "Maintien des libertés parlementaires"] },
            { id: 102, name: "Jean-François Champollion", era: "XIXe Siècle", dates: "1790 – 1832", role: "Égyptologue et linguiste", bio: "Il déchifra les hiéroglyphes égyptiens en 1822 grâce à la pierre de Rosette, fondant la science moderne de l'égyptologie.", quote: "Je tiens mon affaire !", achievements: ["Déchiffrement des hiéroglyphes (1822)", "Création du département égyptien du Louvre", "Père de l'égyptologie scientifique"] },
            { id: 103, name: "André-Marie Ampère", era: "XIXe Siècle", dates: "1775 – 1836", role: "Physicien et mathématicien", bio: "Pionnier de l'électromagnétisme, son nom a été donné à l'unité de mesure du courant électrique (l'ampère).", quote: "Observer pour comprendre, expérimenter pour prouver.", achievements: ["Découverte de l'électrodynamique", "Invention du télégraphe électrique (bases)", "Création de l'unité de l'ampère"] },
            { id: 104, name: "Eugène Delacroix", era: "XIXe Siècle", dates: "1798 – 1863", role: "Peintre chef de file du romantisme", bio: "Maître de la couleur et du mouvement, il immortalisa le peuple soulevé pour la liberté dans son tableau La Liberté guidant le peuple (1830).", quote: "La peinture est un pont entre l'âme et le monde.", achievements: ["La Liberté guidant le peuple", "Voyage inspirant au Maroc", "Chef-d'œuvre de la peinture romantique"] },
            { id: 105, name: "Victor Hugo", era: "XIXe Siècle", dates: "1802 – 1885", role: "Écrivain, poète et homme politique", bio: "Immense géant de la littérature française, auteur des Misérables, de Notre-Dame de Paris, infatigable défenseur de la justice et de la République.", quote: "Demain, l'aube se lèvera splendide et libre.", achievements: ["Les Misérables et Notre-Dame de Paris", "Combat contre la peine de mort", "Immense poésie lyrique et politique"] },
            { id: 106, name: "Honoré de Balzac", era: "XIXe Siècle", dates: "1799 – 1850", role: "Romancier", bio: "Créateur de la Comédie humaine, vaste fresque décrivant avec réalisme et acuité toutes les strates de la société de son époque.", quote: "Le secret des grandes fortunes sans cause apparente est un crime oublié, parce qu'il a été bien fait.", achievements: ["La Comédie humaine (plus de 90 romans)", "Peinture réaliste de la société bourgeoise", "Génie prolifique de l'écriture nocturne"] },
            { id: 107, name: "Alexandre Dumas", era: "XIXe Siècle", dates: "1802 – 1870", role: "Romancier et dramaturge", bio: "Auteur des romans historiques les plus lus au monde : Les Trois Mousquetaires, Le Comte de Monte-Cristo, La Reine Margot.", quote: "Un pour tous, tous pour un !", achievements: ["Les Trois Mousquetaires et Le Comte de Monte-Cristo", "Création du Théâtre-Historique", "Immense succès populaire mondial"] },
            { id: 108, name: "George Sand (Aurore Dupin)", era: "XIXe Siècle", dates: "1804 – 1876", role: "Romancière et féministe", bio: "Femme de lettres audacieuse, aux ménages et aux tenues anticonformistes, autrice de romans champêtres et engagés socialement.", quote: "Le travail est le lot de l'homme, l'art est son apanage.", achievements: ["Romans majeurs (La Mare au Diable)", "Défense des droits des femmes et des ouvriers", "Correspondance littéraire brillante"] },
            { id: 109, name: "Alfred de Musset", era: "XIXe Siècle", dates: "1810 – 1857", role: "Poète et dramaturge romantique", bio: "Poète passionné et mélancolique, auteur de Lorenzaccio et des Nuits, symbole du mal du siècle romantique.", quote: "L'homme est un apprenti, la douleur est son maître.", achievements: ["Lorenzaccio (chef-d'œuvre théâtral)", "Les Nuits (poésie lyrique)", "Figure du romantisme frissonnant"] },
            { id: 110, name: "Hector Berlioz", era: "XIXe Siècle", dates: "1803 – 1869", role: "Compositeur et chef d'orchestre", bio: "Génie de l'orchestration symphonique romantique, compositeur de la monumentale Symphonie fantastique.", quote: "La musique seule peut exprimer l'infini de l'âme.", achievements: ["Symphonie fantastique", "Renouvellement de l'orchestre moderne", "Critique musical visionnaire"] },
            { id: 111, name: "Frédéric Chopin", era: "XIXe Siècle", dates: "1810 – 1849", role: "Compositeur et pianiste", bio: "Bien que né polonais, il passa l'essentiel de sa vie créative à Paris, produisant un répertoire pour piano d'une poésie infinie.", quote: "Rien ne peut remplacer le son d'un piano touché avec émotion.", achievements: ["Œuvre pour piano immortelle (nocturnes, valses)", "Salon parisien artistique d'exception", "Sublimation du romantisme musical"] },
            { id: 112, name: "Eugène Viollet-le-Duc", era: "XIXe Siècle", dates: "1814 – 1879", role: "Architecte et restaurateur", bio: "Il restaura les grands monuments du patrimoine médiéval français, dont Notre-Dame de Paris, Carcassonne et le mont Saint-Michel.", quote: "Restaurer un édifice, ce n'est pas l'entretenir, c'est le rétablir dans un état complet.", achievements: ["Restauration de Notre-Dame de Paris", "Sauvetage de la cité de Carcassonne", "Dictionnaire raisonné de l'architecture française"] },
            { id: 113, name: "Louis-Philippe Ier", era: "XIXe Siècle", dates: "1773 – 1850", role: "Roi des Français (la Monarchie de Juillet)", bio: "Le « Roi Citoyen », bourgeois et libéral, qui régna de 1830 à 1848 avant d'être emporté par la révolution de Février.", quote: "Le trône n'est point un fauteuil de velours, c'est un poste de devoir.", achievements: ["Création du musée historique de Versailles", "Développement des chemins de fer", "Conquête de l'Algérie (débuts)"] },
            { id: 114, name: "Adolphe Thiers", era: "XIXe Siècle", dates: "1797 – 1877", role: "Historien et homme d'État", bio: "Premier président de la Troisième République, critique sévère de la Commune de Paris, historien de la Révolution et du Consulat.", quote: "La République sera conservatrice ou elle ne sera pas.", achievements: ["Pacification après la guerre de 1870", "Libération rapide du territoire national", "Rédacteur de l'Histoire du Consulat et de l'Empire"] },
            { id: 115, name: "Louis Daguerre", era: "XIXe Siècle", dates: "1787 – 1851", role: "Inventeur et artiste", bio: "Inventeur du daguerréotype, premier procédé photographique viable qui révolutionna l'art et la mémoire visuelle.", quote: "La lumière dessine désormais le monde par elle-même.", achievements: ["Invention du daguerréotype (1839)", "Création du diorama", "Révolution de l'image visuelle"] },
            { id: 116, name: "Alexis de Tocqueville", era: "XIXe Siècle", dates: "1805 – 1859", role: "Sociologue et homme politique", bio: "Analyste visionnaire de la démocratie moderne à travers son ouvrage De la démocratie en Amérique.", quote: "La démocratie et le socialisme ne s'entendent que par un mot : l'égalité.", achievements: ["De la démocratie en Amérique", "Analyse pionnière des sociétés égalitaires", "L'Ancien Régime et la Révolution"] },
            { id: 117, name: "Charles Baudelaire", era: "XIXe Siècle", dates: "1821 – 1867", role: "Poète et critique d'art", bio: "Auteur des Fleurs du mal, il métamorphosa la laideur urbaine et la mélancolie en beauté poétique absolue (le Spleen de Paris).", quote: "Il faut être toujours ivre. Tout est là : c'est l'unique question.", achievements: ["Les Fleurs du mal (1857)", "Invention de la modernité poétique", "Critique d'art visionnaire"] },
            { id: 118, name: "Gustave Flaubert", era: "XIXe Siècle", dates: "1821 – 1880", role: "Romancier", bio: "Styliste intransigeant, auteur de Madame Bovary, chef-d'œuvre du roman réaliste et psychologique.", quote: "Madame Bovary, c'est moi.", achievements: ["Madame Bovary et L'Éducation sentimentale", "Quête absolue du mot juste", "Maître du réalisme littéraire"] },
            { id: 119, name: "Jules Verne", era: "XIXe Siècle", dates: "1828 – 1905", role: "Écrivain visionnaire", bio: "Père de la science-fiction moderne, auteur des Voyages extraordinaires (Le Tour du monde en 80 jours, Vingt mille lieues sous les mers).", quote: "Tout ce qu'un homme est capable d'imaginer, d'autres hommes seront capables de le réaliser.", achievements: ["Les Voyages extraordinaires", "Anticipation des inventions du XXe siècle", "Succès mondial intemporel"] },
            { id: 120, name: "Louis Pasteur", era: "XIXe Siècle", dates: "1822 – 1895", role: "Chimiste et microbiologiste", bio: "Inventeur du vaccin contre la rage, découvreur de la pasteurisation, il sauva des millions de vies humaines.", quote: "La science n'a pas de patrie, mais le savant en a une.", achievements: ["Vaccin contre la rage (1885)", "Invention de la pasteurisation", "Rfutation de la génération spontanée"] },
            { id: 121, name: "Claude Bernard", era: "XIXe Siècle", dates: "1813 – 1878", role: "Médecin et physiologiste", bio: "Père de la médecine expérimentale moderne, il théorisa la notion de milieu intérieur et l'homéostasie.", quote: "L'art c'est moi, la science c'est nous.", achievements: ["Introduction de la méthode expérimentale en médecine", "Découvertes sur le rôle du pancréas", "Principes de médecine expérimentale"] },
            { id: 122, name: "Émile Zola", era: "XIXe Siècle", dates: "1840 – 1902", role: "Romancier et journaliste", bio: "Chef de file du naturalisme, auteur de la fresque des Rougon-Macquart et du célèbre « J'accuse… ! » lors de l'affaire Dreyfus.", quote: "La vérité est en marche et rien ne l'arrêtera plus.", achievements: ["Les Rougon-Macquart (20 romans)", "Lettre ouverte « J'accuse… ! »", "Combats pour la justice et la vérité"] },
            { id: 123, name: "Paul Cézanne", era: "XIXe Siècle", dates: "1839 – 1906", role: "Peintre précurseur de l'art moderne", bio: "Par ses recherches sur les formes géométriques de la nature, il ouvrit la voie au cubisme et à la peinture moderne.", quote: "Je veux étonner Paris avec une pomme.", achievements: ["Renouvellement de la nature morte", "Maîtrise de la géométrie picturale", "Influence décisive sur Picasso et Matisse"] },
            { id: 124, name: "Édouard Manet", era: "XIXe Siècle", dates: "1832 – 1883", role: "Peintre précurseur de l'impressionnisme", bio: "Il scandalisa les salons officiels avec Olympia et Le Déjeuner sur l'herbe, devenant le chef de file de la modernité picturale.", quote: "Il faut être de son temps et peindre ce que l'on voit.", achievements: ["Le Déjeuner sur l'herbe et Olympia", "Lien entre réalisme et impressionnisme", "Libération de la touche picturale"] },
            { id: 125, name: "Claude Monet", era: "XIXe Siècle", dates: "1840 – 1926", role: "Peintre impressionniste", bio: "Chef de file de l'impressionnisme, immortalisant la lumière changeante des cathédrales, des gares et de ses célèbres Nymphéas à Giverny.", quote: "La couleur est mon jour, mon souci et mon délice.", achievements: ["Fondation de l'impressionnisme", "Les Nymphéas de Giverny", "Série des Cathédrales de Rouen"] },
            { id: 126, name: "Pierre-Auguste Renoir", era: "XIXe Siècle", dates: "1841 – 1919", role: "Peintre impressionniste", bio: "Célébrateur de la joie de vivre, des bals populaires parisiens et de la sensualité lumineuse dans Le Bal du moulin de la Galette.", quote: "Le pain quotidien de mon art, c'est la joie de peindre.", achievements: ["Le Bal du moulin de la Galette", "Immense chef-d'œuvre de la lumière solaire", "Maîtrise du portrait impressionniste"] },
            { id: 127, name: "Edgar Degas", era: "XIXe Siècle", dates: "1834 – 1917", role: "Peintre et sculpteur", bio: "Maître du mouvement et des scènes de ballet, observateur aigu de la vie parisienne et des courses de chevaux.", quote: "L'art ne vient pas quand on l'attend.", achievements: ["Séries de danseuses et de baigneuses", "Sculpture de la Petite danseuse de 14 ans", "Maîtrise du dessin et du pastel"] },
            { id: 128, name: "Auguste Rodin", era: "XIXe Siècle", dates: "1840 – 1917", role: "Sculpteur de génie", bio: "Père de la sculpture moderne, auteur du Penseur, du Baiser et des Bourgeois de Calais, insufflant la vie à la matière.", quote: "La sculpture est l'art de la bosse et du creux.", achievements: ["Le Penseur et Les Bourgeois de Calais", "Porte de l'Enfer", "Renouvellement radical de la sculpture"] },
            { id: 129, name: "Camille Claudel", era: "XIXe Siècle", dates: "1864 – 1943", role: "Sculptrice et dessinatrice", bio: "Artiste au talent incisif et passionné, autrice d'œuvres poignantes comme L'Âge mûr et La Valse.", quote: "Il y a toujours quelque chose d'absent qui me tourmente.", achievements: ["L'Âge mûr et La Valse", "Maîtrise technique et force expressive", "Reconnaissance tardive mais immense"] },
            { id: 130, name: "Henri Poincaré", era: "XIXe Siècle", dates: "1854 – 1912", role: "Mathématicien, physicien et philosophe", bio: "Dernier savant universel, il posa les bases de la théorie de la relativité restreinte et fonda la topologie algébrique.", quote: "La science est construite de faits, comme une maison de pierres ; mais une accumulation de faits n'est pas plus une science qu'un tas de pierres n'est une maison.", achievements: ["Fondements de la topologie", "Travaux pionniers sur la relativité", "Philosophie des sciences"] },
            { id: 131, name: "Pierre et Marie Curie", era: "XIXe Siècle", dates: "1859 – 1934", role: "Physiciens et chimistes", bio: "Pionniers de la radioactivité, Marie Curie fut la première femme prix Nobel et la seule à l'obtenir dans deux domaines scientifiques différents.", quote: "Rien dans la vie n'est à craindre, tout est à comprendre.", achievements: ["Découverte du radium et du polonium", "Deux prix Nobel (physique et chimie)", "Développement des unités mobiles de radiographie"] },
            { id: 132, name: "Georges Méliès", era: "XIXe Siècle", dates: "1861 – 1938", role: "Pionnier du cinéma et illusionniste", bio: "Inventeur des effets spéciaux cinématographiques et auteur du célèbre film Le Voyage dans la Lune (1902).", quote: "Donner vie aux rêves sur pellicule est la magie suprême.", achievements: ["Le Voyage dans la Lune", "Invention des trucages optiques au cinéma", "Premier studio de cinéma à Montreuil"] },

        let currentEra = 'Toutes';

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', () => {
            renderFigures();
            updateFavoritesCount();
        });

        // Handle filtering by era
        function filterByEra(era) {
            currentEra = era;
            document.querySelectorAll('.era-tab').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
            });
            const activeBtn = document.getElementById(`era-btn-${era}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
                activeBtn.classList.add('bg-slate-900', 'text-white');
            }
            renderFigures();
        }

        // Handle search input
        function handleSearch() {
            const input = document.getElementById('search-input');
            searchQuery = input.value.toLowerCase().trim();
            renderFigures();
        }

        // Toggle favorites view mode
        function toggleFavoritesFilter() {
            favoritesOnly = !favoritesOnly;
            const btn = document.getElementById('favorites-toggle');
            if (favoritesOnly) {

                btn.classList.remove('bg-white', 'text-slate-700');
            } else {
                btn.classList.remove('bg-amber-50', 'border-amber-300', 'text-amber-900');
                btn.classList.add('bg-white', 'text-slate-700');
            }
            renderFigures();
        }

        // Reset all filters
        function resetFilters() {
            currentEra = 'Toutes';
            searchQuery = '';
            favoritesOnly = false;
            document.getElementById('search-input').value = '';
            document.getElementById('favorites-toggle').classList.remove('bg-amber-50', 'border-amber-300', 'text-amber-900');
            document.getElementById('favorites-toggle').classList.add('bg-white', 'text-slate-700');
            filterByEra('Toutes');
        }

        // Toggle favorite state for a figure ID
        function toggleFavorite(id, event) {
            if (event) event.stopPropagation();
            const index = favorites.indexOf(id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('french_figures_favs', JSON.stringify(favorites));
            updateFavoritesCount();
            renderFigures();
            if (selectedFigureId === id) {
                updateModalFavoriteState();
            }
        }

        function updateFavoritesCount() {
            document.getElementById('favorites-count').textContent = favorites.length;
        }

        // Render main grid of cards
        function renderFigures() {
            const grid = document.getElementById('figures-grid');
            const emptyState = document.getElementById('empty-state');
            const resultsCount = document.getElementById('results-count');

            let filtered = figuresData.filter(fig => {
                const matchesEra = (currentEra === 'Toutes' || fig.era === currentEra);
                const matchesSearch = fig.name.toLowerCase().includes(searchQuery) || 
                                      fig.role.toLowerCase().includes(searchQuery) ||
                                      fig.era.toLowerCase().includes(searchQuery);
                const matchesFav = (!favoritesOnly || favorites.includes(fig.id));
                return matchesEra && matchesSearch && matchesFav;
            });

            resultsCount.textContent = `Affichage de ${filtered.length} figure${filtered.length > 1 ? 's' : ''} historique${filtered.length > 1 ? 's' : ''}`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(fig => {
                const isFav = favorites.includes(fig.id);
                return `
                    <div onclick="openModal(${fig.id})" class="bg-white border border-slate-200/80 rounded-2xl p-4 sm:p-5 hover:shadow-md hover:border-amber-300/60 transition duration-200 flex flex-col justify-between cursor-pointer group relative">
                        <div class="absolute top-4 right-4 z-10">
                            <button onclick="toggleFavorite(${fig.id}, event)" class="w-8 h-8 rounded-full bg-slate-50 hover:bg-amber-50 flex items-center justify-center text-slate-400 hover:text-amber-600 transition shadow-2xs">
                                <i class="${isFav ? 'fa-solid text-amber-600' : 'fa-regular'} fa-bookmark text-xs"></i>
                            </button>
                        </div>
                        <div>
                            <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-amber-50 text-amber-800 border border-amber-200/60 mb-2 truncate max-w-[150px]">${fig.era}</span>
                            <h3 class="font-bold text-slate-900 text-sm sm:text-base group-hover:text-amber-700 transition leading-tight pr-6">${fig.name}</h3>
                            <p class="text-xs text-amber-800/80 font-medium mt-0.5 line-clamp-1">${fig.role}</p>
                            <p class="text-[11px] text-slate-400 mt-1">${fig.dates}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500 font-medium">
                            <span class="truncate pr-2 italic">« ${fig.quote.substring(0, 35)}... »</span>
                            <span class="text-amber-600 group-hover:translate-x-1 transition flex-shrink-0"><i class="fa-solid fa-arrow-right text-[10px]"></i></span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Modal interactions
        function openModal(id) {
            selectedFigureId = id;
            const fig = figuresData.find(f => f.id === id);
            if (!fig) return;

            document.getElementById('modal-era-badge').textContent = fig.era;
            document.getElementById('modal-dates').textContent = fig.dates;
            document.getElementById('modal-name').textContent = fig.name;
            document.getElementById('modal-role').textContent = fig.role;
            document.getElementById('modal-quote').textContent = `"${fig.quote}"`;
            document.getElementById('modal-bio').textContent = fig.bio;

            const achievementsList = document.getElementById('modal-achievements');
            achievementsList.innerHTML = fig.achievements.map(ach => `
                <li class="flex items-start space-x-2">
                    <span class="text-amber-600 mt-1"><i class="fa-solid fa-check text-xs"></i></span>
                    <span>${ach}</span>
                </li>
            `).join('');

            updateModalFavoriteState();

            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            document.body.style.overflow = 'auto';
            selectedFigureId = null;
        }

        function toggleFavoriteCurrentModal() {
            if (selectedFigureId !== null) {
                toggleFavorite(selectedFigureId, null);
            }
        }

        function updateModalFavoriteState() {
            const favBtn = document.getElementById('modal-fav-btn');
            const isFav = favorites.includes(selectedFigureId);
            if (isFav) {
                favBtn.innerHTML = '<i class="fa-solid text-amber-600 fa-bookmark"></i>';
                favBtn.classList.add('border-amber-300', 'bg-amber-50');
            } else {
                favBtn.innerHTML = '<i class="fa-regular fa-bookmark"></i>';
                favBtn.classList.remove('border-amber-300', 'bg-amber-50');
            }
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('detail-modal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
