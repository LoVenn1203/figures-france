    <!-- Modal pour les Personnalités -->

            { name: "Thierry Ier", era: "Francs & Mérovingiens", dates: "485 – 534", role: "Roi de Metz (Austrasie)", quote: "Maintenir l'empire des Francs divisé mais puissant.", bio: "Fils de Clovis, il hérita du royaume de Reims/Metz lors du partage du royaume.", anecdote: "Il mena de nombreuses expéditions en Thuringe.", heritage: "Structuration de l'Austrasie mérovingienne.", tags: ["Austrasie", "Partage", "Metz"] },
            { name: "Clotaire Ier", era: "Francs & Mérovingiens", dates: "497 – 561", role: "Roi des Francs", quote: "Réunir sous un même sceptre les terres des Francs.", bio: "Fils cadet de Clovis, il parvint à réunifier brièvement l'ensemble du royaume franc à la fin de sa vie.", anecdote: "Il fit brûler vif son propre fils rebelle Chramn.", heritage: "Poursuite de l'unification politique franque.", tags: ["Réunification", "Fils de Clovis"] },
            { name: "Dagobert Ier", era: "Francs & Mérovingiens", dates: "603 – 639", role: "Roi des Francs", quote: "Justice et munificence pour les abbayes.", bio: "Dernier roi mérovingien puissant avant la période des 'rois fainéants'.", anecdote: "La chanson populaire sur sa culotte à l'envers est une satire bien plus tardive.", heritage: "Fondation de la basilique Saint-Denis.", tags: ["Saint-Denis", "Rois fainéants", "Monarchie"] },
            { name: "Charles Martel", era: "Francs & Mérovingiens", dates: "688 – 741", role: "Maire du palais", quote: "Repousser l'envahisseur pour sauver la chrétienté.", bio: "Maire du palais d'Austrasie, il arrêta l'avancée des troupes arabo-berbères à Poitiers en 732.", anecdote: "Le surnom 'Martel' vient de sa force au combat, semblable à un marteau.", heritage: "Sauvegarde de l'Occident chrétien et montée en puissance des Carolingiens.", tags: ["Poitiers", "732", "Maire du palais"] },
            { name: "Pépin de Herstal", era: "Francs & Mérovingiens", dates: "635 – 714", role: "Maire du palais d'Austrasie", quote: "Unir les provinces sous une poigne de fer.", bio: "Il imposa son autorité sur l'ensemble des royaumes francs, marginalisant la dynastie mérovingienne.", anecdote: "Aïeul direct de Charlemagne.", heritage: "Il instaura l'hégémonie de la famille des Pippinides.", tags: ["Pippinides", "Austrasie"] },

            // Carolingiens
            { name: "Pépin le Bref", era: "Carolingiens", dates: "714 – 768", role: "Roi des Francs", quote: "Celui qui exerce le pouvoir doit porter le titre de roi.", bio: "Fils de Charles Martel, il renversa le dernier roi mérovingien et fonda la dynastie carolingienne en 751.", anecdote: "Il fut sacré par le pape Étienne II à Saint-Denis.", heritage: "Fondation de la dynastie carolingienne et alliance avec la papauté.", tags: ["Sacre", "Carolingiens", "751"] },
            { name: "Charlemagne", era: "Carolingiens", dates: "742 – 814", role: "Roi des Francs et Empereur", quote: "Créer des écoles pour tous.", bio: "Il unifia une grande partie de l'Europe occidentale et instaura la Renaissance carolingienne.", anecdote: "Il apprit tardivement à écrire sous son oreiller.", heritage: "Père de l'Europe unie et figure tutélaire de l'école.", tags: ["Carolingiens", "Empire", "An 800", "Renaissance"] },
            { name: "Roland", era: "Carolingiens", dates: "778 – 778", role: "Paladin de Charlemagne", quote: "A moi Roncevaux !", bio: "Neveu de Charlemagne, héros légendaire de la bataille de Roncevaux contre les Sarrasins.", anecdote: "Il aurait brisé son épée Durandal contre un rocher pour qu'elle ne tombe pas aux mains ennemies.", heritage: "Héros de la *Chanson de Roland*, chef-d'œuvre de la geste médiévale.", tags: ["Roncevaux", "Épée", "Paladin"] },
            { name: "Louis le Pieux", era: "Carolingiens", dates: "778 – 840", role: "Empereur d'Occident", quote: "Maintenir l'unité de l'Empire chrétien.", bio: "Fils de Charlemagne, son règne fut secoué par les guerres civiles fratricides entre ses fils.", anecdote: "Surnommé 'le Pieux' en raison de sa grande dévotion religieuse.", heritage: "Division finale de l'Empire par le traité de Verdun.", tags: ["Verdun", "Fils de Charlemagne"] },
            { name: "Charles le Chauve", era: "Carolingiens", dates: "823 – 877", role: "Roi de France occidentale et Empereur", quote: "Fonder les bases d'un royaume franc occidental.", bio: "Bénéficiaire de la Francie occidentale lors du traité de Verdun en 843.", anecdote: "Il dut faire face à de redoutables raids vikings sur la Seine.", heritage: "Ancêtre direct du royaume de France.", tags: ["Verdun", "843", "Francie"] },
            { name: "Lothaire Ier", era: "Carolingiens", dates: "795 – 855", role: "Empereur d'Occident", quote: "Garder le titre impérial et la Francie médiane.", bio: "Fils aîné de Louis le Pieux, il reçut la bande centrale (Lotharingie) lors du traité de Verdun.", anecdote: "Son royaume intermédiaire a donné son nom à la Lorraine.", heritage: "Échec de l'unité impériale centrale.", tags: ["Lotharingie", "Verdun"] },
            { name: "Louis le Germanique", era: "Carolingiens", dates: "806 – 876", role: "Roi de Francie orientale", quote: "Bâtir le futur espace germanique.", bio: "Il obtint la partie orientale de l'Empire lors du partage de Verdun.", anecdote: "Il signa les Serments de Strasbourg en vieux haut allemand et vieux français.", heritage: "Fondation des prémices de l'Allemagne.", tags: ["Strasbourg", "Francie orientale"] },
            { name: "Charles le Gros", era: "Carolingiens", dates: "839 – 888", role: "Empereur d'Occident", quote: "Sauver Paris des Vikings.", bio: "Il parvint à réunir brièvement l'Empire de Charlemagne avant d'être déposé pour sa faiblesse face aux Normands.", anecdote: "Il acheta le départ des Vikings assiégeant Paris en 885.", heritage: "Effondrement définitif de l'unité carolingienne.", tags: ["Vikings", "Paris", "Déchéance"] },

            // Moyen Âge — Capétiens
            { name: "Hugues Capet", era: "Moyen Âge — Capétiens", dates: "941 – 996", role: "Roi des Francs", quote: "Qui t'a fait comte ?", bio: "Fondateur de la dynastie des Capétiens, il mit fin aux divisions instables des Carolingiens.", anecdote: "Il parlait encore le vieux francique et connaissait peu le latin.", heritage: "Il fonda la lignée qui régna sur la France pendant plus de 800 ans.", tags: ["Capétiens", "Monarchie", "Moyen Âge"] },
            { name: "Robert II", era: "Moyen Âge — Capétiens", dates: "972 – 1031", role: "Roi des Francs", quote: "La piété guide le souverain.", bio: "Surnommé 'le Pieux', il consolida la dynastie capétienne naissante et protégea l'Église.", anecdote: "Il fut brièvement excommunié pour avoir épousé sa cousine Berthe de Bourgogne.", heritage: "Consolidation pacifique du pouvoir royal.", tags: ["Capétiens", "Le Pieux"] },
            { name: "Philippe Ier", era: "Moyen Âge — Capétiens", dates: "1052 – 1108", role: "Roi des Francs", quote: "Accroître patiemment le domaine royal.", bio: "Son long règne vit l'expansion progressive du pouvoir royal autour de l'Île-de-France.", anecdote: "Il fut surnommé 'l'Amoureux' en raison de ses frasques conjugales.", heritage: "Maintien de la dynastie malgré des difficultés féodales.", tags: ["Île-de-France", "Féodalité"] },
            { name: "Louis VI", era: "Moyen Âge — Capétiens", dates: "1081 – 1137", role: "Roi des Francs", quote: "Soumettre les barons pillards.", bio: "Surnommé 'le Gros', il passa son règne à pacifier l'Île-de-France en matant les seigneurs brigands.", anecdote: "Il fut un combattant courageux sur les champs de bataille malgré son embonpoint.", heritage: "Affermissement de l'autorité royale directe.", tags: ["Barons", "Pacification"] },
            { name: "Louis VII", era: "Moyen Âge — Capétiens", dates: "1120 – 1180", role: "Roi des Francs", quote: "L'épreuve de la croisade et de la rupture.", bio: "Il participa à la seconde croisade et répudia Aliénor d'Aquitaine, provoquant une crise géopolitique majeure.", anecdote: "Sa séparation entraîna le rattachement de l'Aquitaine à la couronne d'Angleterre.", heritage: "Conflit germinal avec les Plantagenêts.", tags: ["Croisade", "Aliénor", "Plantagenêt"] },
            { name: "Aliénor d'Aquitaine", era: "Moyen Âge — Capétiens", dates: "1122 – 1204", role: "Duchesse d'Aquitaine et Reine de France puis d'Angleterre", quote: "Femme de pouvoir et de liberté.", bio: "Figure majeure du Moyen Âge, reine de France puis d'Angleterre, mère de Richard Cœur de Lion.", anecdote: "Elle participa activement à la deuxième croisade à cheval avec ses dames de compagnie.", heritage: "Redistribution colossale des terres féodales européennes.", tags: ["Aquitaine", "Reine", "Croisades"] },
            { name: "Philippe II Auguste", era: "Moyen Âge — Capétiens", dates: "1165 – 1223", role: "Roi de France", quote: "Triompher des Plantagenêts et bâtir Paris.", bio: "Il confisqua les fiefs continentaux des rois d'Angleterre et remporta la célèbre bataille de Bouvines en 1214.", anecdote: "Il fit paver les rues boueuses de Paris et construisit l'enceinte fortifiée.", heritage: "Naissance de l'État royal moderne et centralisé.", tags: ["Bouvines", "Paris", "Plantagenêt"] },
            { name: "Richard Cœur de Lion", era: "Moyen Âge — Capétiens", dates: "1157 – 1199", role: "Roi d'Angleterre et Duc de Normandie", quote: "Le courage face à Philippe Auguste.", bio: "Fils d'Aliénor d'Aquitaine, brillant chef militaire de la troisième croisade.", anecdote: "Il passa la majeure partie de son règne hors d'Angleterre, captif en Autriche.", heritage: "Mythe chevaleresque anglo-normand.", tags: ["Croisade", "Plantagenêt", "Normandie"] },
            { name: "Jean sans Terre", era: "Moyen Âge — Capétiens", dates: "1166 – 1216", role: "Roi d'Angleterre", quote: "La perte des possessions françaises.", bio: "Adversaire malheureux de Philippe Auguste, il perdit la Normandie et dut signer la Magna Carta.", anecdote: "Son surnom vient du fait qu'il n'avait pas reçu de terres de son père à l'aînesse.", heritage: "Limitation fondatrice du pouvoir royal en Angleterre.", tags: ["Magna Carta", "Normandie"] },
            { name: "Blanche de Castille", era: "Moyen Âge — Capétiens", dates: "1188 – 1252", role: "Reine mère et Régente de France", quote: "Plutôt voir mon fils mort que pécheur.", bio: "Régente énergique et avisée pendant la minorité de Saint Louis, elle matta la révolte des grands barons.", anecdote: "Elle dirigea le royaume d'une main de fer avec un grand talent politique.", heritage: "Sauvegarde et renforcement de l'intégrité du royaume.", tags: ["Régente", "Saint Louis"] },
            { name: "Louis IX — Saint Louis", era: "Moyen Âge — Capétiens", dates: "1214 – 1270", role: "Roi de France", quote: "Justice et équité pour le peuple.", bio: "Souverain pieux, il créa la monnaie royale unique et développa la justice royale.", anecdote: "Il rendait la justice sous un chêne à Vincennes.", heritage: "Canonisé, il incarna l'idéal du roi chrétien et juste.", tags: ["Croisades", "Justice", "Sainte-Chapelle"] },
            { name: "Philippe III", era: "Moyen Âge — Capétiens", dates: "1245 – 1285", role: "Roi de France", quote: "Poursuivre l'œuvre de mon père.", bio: "Surnommé 'le Hardi', son règne fut marqué par l'expédition malheureuse en Aragon.", anecdote: "Il dut rapatrier en France les corps de son père et de sa famille décimés par la maladie.", heritage: "Maintien de la puissance territoriale capétienne.", tags: ["Aragon", "Le Hardi"] },
            { name: "Philippe IV le Bel", era: "Moyen Âge — Capétiens", dates: "1268 – 1314", role: "Roi de France", quote: "L'État souverain au-dessus de tout.", bio: "Roi autoritaire, il s'opposa à la papauté, créa les États Généraux et détruisit l'Ordre du Temple.", anecdote: "Il fut confronté à la fameuse malédiction des Templiers.", heritage: "Modernisation administrative et affirmation de la souveraineté laïque.", tags: ["Templiers", "États Généraux", "Papauté"] },
            { name: "Boniface VIII", era: "Moyen Âge — Capétiens", dates: "1235 – 1303", role: "Pape", quote: "La suprématie spirituelle et temporelle de l'Église.", bio: "Redoutable opposant à Philippe le Bel dans le conflit sur la fiscalité du clergé.", anecdote: "Il fut victime de l'attentat d'Anagni par les troupes françaises.", heritage: "Affaiblissement du pouvoir politique de la papauté en Europe.", tags: ["Pape", "Anagni"] },
            { name: "Jacques de Molay", era: "Moyen Âge — Capétiens", dates: "1244 – 1314", role: "Grand Maître des Templiers", quote: "Innocents de tous les crimes qu'on nous reproche.", bio: "Dernier grand maître de l'Ordre du Temple, brûlé vif à Paris après les procès intentés par Philippe le Bel.", anecdote: "Selon la légende, il aurait maudit le roi et le pape avant de mourir.", heritage: "Mythe durable de la malédiction des Templiers.", tags: ["Templiers", "Bûcher", "Malédiction"] },

            // Guerre de Cent Ans
            { name: "Philippe VI", era: "Guerre de Cent Ans", dates: "1293 – 1350", role: "Roi de France", quote: "Le premier des Valois face au péril anglais.", bio: "Premier roi de la branche des Valois, son accession au trône déclencha la guerre de Cent Ans.", anecdote: "Il fut sévèrement battu lors de la bataille de Crécy en 1346.", heritage: "Fondation de la dynastie des Valois.", tags: ["Valois", "Crécy", "Guerre de Cent Ans"] },
            { name: "Édouard III", era: "Guerre de Cent Ans", dates: "1312 – 1377", role: "Roi d'Angleterre", quote: "Revendiquer la couronne de France par les armes.", bio: "Il initia les grandes offensives anglaises victorieuses de la guerre de Cent Ans (Crécy, Calais).", anecdote: "Il fonda l'illustre Ordre de la Jarretière.", heritage: "Établissement de la suprématie militaire anglaise initiale.", tags: ["Angleterre", "Crécy", "Jaretière"] },
            { name: "Jean II le Bon", era: "Guerre de Cent Ans", dates: "1319 – 1364", role: "Roi de France", quote: "Captif mais inflexible.", bio: "Fait prisonnier par les Anglais lors de la désastreuse bataille de Poitiers en 1356.", anecdote: "Il retourna volontairement en captivité à Londres faute de pouvoir payer sa rançon.", heritage: "Grave crise politique et financière de la France médiévale.", tags: ["Poitiers", "1356", "Rançon"] },
            { name: "Charles V", era: "Guerre de Cent Ans", dates: "1338 – 1380", role: "Roi de France", quote: "La victoire par la prudence et la stratégie.", bio: "Surnommé 'le Sage', il redressa brillamment la situation militaire française grâce à Du Guesclin.", anecdote: "Grand bibliophile, il fonda la première bibliothèque royale au Louvre.", heritage: "Reconquête de la plus grande partie du territoire perdu.", tags: ["Le Sage", "Du Guesclin", "Louvre"] },
            { name: "Charles VI", era: "Guerre de Cent Ans", dates: "1368 – 1422", role: "Roi de France", quote: "La folie du roi et la déchirure du royaume.", bio: "Surnommé 'le Bien-Aimé' puis 'le Fou', son règne sombra dans la guerre civile entre Armagnacs et Bourguignons.", anecdote: "Il souffrait de crises de démence violentes au cours desquelles il ne reconnaissait plus personne.", heritage: "Effondrement politique menant au traité d'Azincourt.", tags: ["Le Fou", "Armagnacs", "Bourguignons"] },
            { name: "Charles VII", era: "Guerre de Cent Ans", dates: "1403 – 1461", role: "Roi de France", quote: "Le 'petit roi de Bourges' devenu le Victorieux.", bio: "Surnommé 'le Victorieux', il chassa définitivement les Anglais de France grâce à l'élan insufflé par Jeanne d'Arc.", anecdote: "Il établit sa cour à Bourges pendant l'occupation de Paris par les Anglais.", heritage: "Fin de la guerre de Cent Ans et création d'une armée permanente.", tags: ["Le Victorieux", "Bourges", "Bout de la guerre"] },
            { name: "Henri V d'Angleterre", era: "Guerre de Cent Ans", dates: "1386 – 1422", role: "Roi d'Angleterre", quote: "Le triomphe fulgurant d'Azincourt.", bio: "Brillant chef militaire, il écrasa l'armée française à Azincourt en 1415 et faillit unifier les deux couronnes.", anecdote: "Il fut immortalisé par la pièce éponyme de Shakespeare.", heritage: "Apogée de la puissance anglaise en France.", tags: ["Azincourt", "1415", "Shakespeare"] },
            { name: "Henri VI d'Angleterre", era: "Guerre de Cent Ans", dates: "1421 – 1471", role: "Roi d'Angleterre et de France (contesté)", quote: "Un destin tragique et fragile.", bio: "Couronné roi de France à Paris enfant, il perdit progressivement toutes les possessions françaises.", anecdote: "Il souffrait de graves troubles psychiatriques similaires à ceux de son grand-père maternel Charles VI.", heritage: "Perte définitive des terres continentales anglaises (sauf Calais).", tags: ["Couronnement", "Guerre des Deux-Roses"] },
            { name: "Jeanne d'Arc", era: "Guerre de Cent Ans", dates: "1412 – 1431", role: "Héroïne nationale et cheffe de guerre", quote: "Les gens d'armes batailleront, et Dieu donnera la victoire !", bio: "Figure emblématique de la guerre de Cent Ans, elle mena les troupes françaises à la levée du siège d'Orléans.", anecdote: "Elle fut brûlée vive à Rouen à l'âge de 19 ans par les Anglais.", heritage: "Sainte patronne de la France et symbole absolu du patriotisme.", tags: ["Orléans", "Guerre de Cent Ans", "Bûcher"] },
            { name: "Jean sans Peur", era: "Guerre de Cent Ans", dates: "1371 – 1419", role: "Duc de Bourgogne", quote: "L'ambition sanglante au cœur de Paris.", bio: "Chef du clan des Bourguignons, il fit assassiner son rival Louis d'Orléans en 1407.", anecdote: "Il fut lui-même assassiné lors d'une entrevue politique sur le pont de Montereau.", heritage: "Guerre civile sanglante entre Armagnacs et Bourguignons.", tags: ["Bourguignons", "Assassinat", "Montereau"] },
            { name: "Philippe le Bon", era: "Guerre de Cent Ans", dates: "1396 – 1467", role: "Duc de Bourgogne", quote: "La splendeur de l'État bourguignon.", bio: "L'un des princes les plus puissants d'Europe, il s'allia aux Anglais avant de se réconcilier avec Charles VII.", anecdote: "Il fonda l'ordre prestigieux de la Toison d'or.", heritage: "Rayonnement culturel et artistique des Flandres et de Bourgogne.", tags: ["Toison d'or", "Flandres", "Bourgogne"] },
            { name: "Bertrand du Guesclin", era: "Guerre de Cent Ans", dates: "1320 – 1380", role: "Connétable de France", quote: "La guerre de harcèlement contre les Anglais.", bio: "Connétable de France sous Charles V, il reconquit de vastes territoires sans jamais livrer de grande bataille rangée.", anecdote: "Réputé pour sa laideur physique, il compensait par un génie tactique hors du commun.", heritage: "Restauration de la fierté militaire française.", tags: ["Connétable", "Harcèlement", "Charles V"] },

            // Renaissance
            { name: "Louis XI", era: "Renaissance", dates: "1423 – 1483", role: "Roi de France", quote: "Ruse et patience pour abattre la féodalité.", bio: "Surnommé 'l'Universelle Aragne' (l'araignée), il brisa la puissance de Charles le Téméraire et unifia le royaume.", anecdote: "Il préférait la diplomatie tortueuse et les pots-de-vin aux charges militaires frontales.", heritage: "Fixation des frontières et consolidation de l'État moderne.", tags: ["L'Aragne", "Bourgogne", "Unification"] },
            { name: "Charles VIII", era: "Renaissance", dates: "1470 – 1498", role: "Roi de France", quote: "L'appel de l'Italie.", bio: "Il envahit l'Italie en 1494, déclenchant les guerres d'Italie qui marqueront la Renaissance française.", anecdote: "Il mourut bêtement à Amboise en se cognant violemment la tête contre un linteau de porte.", heritage: "Découverte des arts italiens et introduction de la Renaissance artistique.", tags: ["Guerres d'Italie", "Amboise"] },
            { name: "Louis XII", era: "Renaissance", dates: "1462 – 1515", role: "Roi de France", quote: "Le père du peuple.", bio: "Surnommé 'le Père du peuple', il poursuivit les guerres en Italie tout en allégeant les impôts.", anecdote: "Il épousa Anne de Bretagne pour conserver le duché rattaché à la couronne.", heritage: "Prospérité économique relative et essor artistique.", tags: ["Père du peuple", "Anne de Bretagne"] },
            { name: "Anne de Bretagne", era: "Renaissance", dates: "1477 – 1514", role: "Duchesse de Bretagne et Reine de France", quote: "Plutôt mourir que perdre mes libertés bretonnes.", bio: "Duchesse souveraine de Bretagne, elle épousa successivement deux rois de France (Charles VIII puis Louis XII).", anecdote: "Elle fonda l'ordre des dames de la Hermine.", heritage: "Rattachement progressif et pacifié de la Bretagne à la France.", tags: ["Bretagne", "Duchesse", "Reine"] },
            { name: "François Ier", era: "Renaissance", dates: "1494 – 1547", role: "Roi de France", quote: "Tout est perdu fors l'honneur.", bio: "Monarque de la Renaissance française, grand protecteur des arts et des lettres (mécène de Léonard de Vinci).", anecdote: "Il fit venir la Joconde en France après avoir invité Vinci.", heritage: "Rayonnement culturel de la France et introduction de l'humanisme royal.", tags: ["Renaissance", "Chambord", "Arts"] },
            { name: "Henri II", era: "Renaissance", dates: "1519 – 1559", role: "Roi de France", quote: "Poursuivre la grandeur royale.", bio: "Fils de François Ier, il consolida les frontières de l'Est (Trois-Évêchés) et soutint les arts.", anecdote: "Il mourut tragiquement lors d'un tournoi chevaleresque d'un éclat de lance dans l'œil.", heritage: "Renforcement de l'absolutisme monarchique.", tags: ["Tournoi", "Trois-Évêchés"] },
            { name: "Catherine de Médicis", era: "Renaissance", dates: "1519 – 1589", role: "Reine et Régente de France", quote: "Sauver la couronne au milieu du chaos.", bio: "Épouse d'Henri II, reine mère influente et régente pendant les pires heures des guerres de religion.", anecdote: "Elle introduisit la fourchette et le ballet à la cour de France.", heritage: "Sauvegarde de la dynastie des Valois dans la tourmente.", tags: ["Reine mère", "Guerres de religion"] },
            { name: "Diane de Poitiers", era: "Renaissance", dates: "1499 – 1566", role: "Favorite d'Henri II", quote: "L'élégance et l'influence au sommet de l'État.", bio: "Favorite incontestée du roi Henri II, femme d'une grande culture et mécène avisée.", anecdote: "Elle continua à boire de l'or potable pour préserver sa jeunesse selon les croyances de l'époque.", heritage: "Propriétaire du magnifique château de Chenonceau.", tags: ["Favorite", "Chenonceau"] },
            { name: "Léonard de Vinci", era: "Renaissance", dates: "1452 – 1519", role: "Peintre, inventeur et génie universel", quote: "La peinture est de la poésie qui se voit.", bio: "Invité par François Ier à Amboise, il passa ses dernières années au Clos Lucé.", anecdote: "Il arriva en France à dos de mulet en transportant dans ses bagages la Joconde.", heritage: "Symbole absolu de l'esprit universel de la Renaissance.", tags: ["Génie", "Clos Lucé", "Joconde"] },
            { name: "Nostradamus", era: "Renaissance", dates: "1503 – 1566", role: "Apothicaire et astrologue", quote: "Lire l'avenir dans les mystères du temps.", bio: "Médecin et astrologue français célèbre pour ses prophéties énigmatiques publiées dans ses *Centuries*.", anecdote: "Il devint médecin ordinaire du roi Charles IX.", heritage: "Mythe pérenne de la prédiction eschatologique.", tags: ["Prophéties", "Astrologue"] },

            // Guerres de Religion
            { name: "François II", era: "Guerres de Religion", dates: "1544 – 1560", role: "Roi de France", quote: "Un règne bref sous l'emprise des Guise.", bio: "Époux de Marie Stuart, son court règne fut dominé par l'influence de la puissante famille des Guise.", anecdote: "Il mourut à l'âge de 16 ans d'une infection auriculaire.", heritage: "Prémices des tensions religieuses violentes.", tags: ["Guise", "Marie Stuart"] },
            { name: "Charles IX", era: "Guerre de Religion", dates: "1550 – 1574", role: "Roi de France", quote: "Tuez-les tous, puisqu'ils le veulent !", bio: "Son règne fut marqué par l'horreur du massacre de la Saint-Barthélemy en 1572.", anecdote: "Il aurait lui-même tiré sur des protestants fuyant le Louvre depuis sa fenêtre selon la légende.", heritage: "Paroxysme de la violence des guerres civiles religieuses.", tags: ["Saint-Barthélemy", "1572"] },
            { name: "Henri III", era: "Guerre de Religion", dates: "1551 – 1589", role: "Roi de France", quote: "Le dernier des Valois face à la Ligue.", bio: "Roi lettré et raffiné, pris en étau entre catholiques intransigeants et protestants pendant la crise de la Ligue.", anecdote: "Il s'entourait de jeunes favoris élégants appelés 'les Mignons'.", heritage: "Assassinat tragique marquant la fin des Valois.", tags: ["Ligue", "Mignons", "Valois"] },
            { name: "Henri IV", era: "Guerres de Religion", dates: "1553 – 1610", role: "Roi de France et de Navarre", quote: "Ralliez-vous à mon panache blanc.", bio: "Il mit fin aux guerres de religion en signant l'Édit de Nantes en 1598.", anecdote: "Il promit la fameuse 'poule au pot' dominicale à tous les paysans.", heritage: "Père de la tolérance religieuse et de l'apaisement national.", tags: ["Édit de Nantes", "Vert Galant", "Paix"] },
            { name: "Marguerite de Valois", era: "Guerres de Religion", dates: "1553 – 1615", role: "Reine de France et de Navarre", quote: "La reine rebelle au destin romanesque.", bio: "Surnommée 'la Reine Margot', son mariage avec Henri de Navarre coïncida avec la Saint-Barthélemy.", anecdote: "Elle sauva la vie de plusieurs gentilshommes protestants pendant la nuit tragique.", heritage: "Héroïne romantique de la littérature française.", tags: ["Reine Margot", "Valois"] },
            { name: "Gaspard II de Coligny", era: "Guerres de Religion", dates: "1519 – 1572", role: "Amiral et chef protestant", quote: "La foi et le combat pour la liberté de conscience.", bio: "Chef militaire des huguenots, il fut la première victime illustre du massacre de la Saint-Barthélemy.", anecdote: "Son corps fut jeté dans la Seine par la foule en délire.", heritage: "Martyr de la cause protestante française.", tags: ["Amiral", "Huguenots", "Saint-Barthélemy"] },
            { name: "François de Guise", era: "Guerres de Religion", dates: "1519 – 1563", role: "Duc de Guise et chef catholique", quote: "Défendre la foi catholique par les armes.", bio: "Brillant chef de guerre, champion du camp catholique intransigeant.", anecdote: "Il reprit Calais aux Anglais en plein hiver.", heritage: "Fondateur de la puissance politique de la maison de Guise.", tags: ["Guise", "Calais", "Catholiques"] },
            { name: "Henri de Guise", era: "Guerre de Religion", dates: "1550 – 1588", role: "Duc de Guise", quote: "Le Balafré aux portes du pouvoir royal.", bio: "Surnommé 'le Balafré', chef de la Ligue catholique, il tint en échec le roi Henri III.", anecdote: "Il fut assassiné sur ordre du roi Henri III dans le château de Blois.", heritage: "Crise suprême de l'autorité royale.", tags: ["Le Balafré", "Ligue", "Blois"] },
            { name: "Michel de L'Hospital", era: "Guerres de Religion", dates: "1505 – 1573", role: "Chancelier de France", quote: "Ôtez les mots de luthérien et de papiste, restons Français.", bio: "Chancelier humaniste, ardent défenseur de la tolérance civile et de la concorde entre religions.", anecdote: "Il résista courageusement aux pressions extrémistes des deux camps.", heritage: "Précurseur de la laïcité et de l'édit de tolérance.", tags: ["Tolérance", "Chancelier"] },
            { name: "Théodore de Bèze", era: "Guerres de Religion", dates: "1519 – 1605", role: "Théologien protestant", quote: "La plume et la parole pour la Réforme.", bio: "Principal disciple de Calvin, chef intellectuel du protestantisme français et européen.", anecdote: "Il organisa le colloque de Poissy pour tenter de réconcilier catholiques et protestants.", heritage: "Structuration théologique de l'Église réformée.", tags: ["Calvin", "Protestantisme"] },

            // XVIIe siècle
            { name: "Louis XIII", era: "XVIIe siècle", dates: "1601 – 1643", role: "Roi de France", quote: "Servir l'État avec rigueur et piété.", bio: "Souverain pieux et solitaire, il s'appuya sur le cardinal de Richelieu pour mater les rebelles et affirmer la couronne.", anecdote: "Il composa lui-même des ballets royaux et jouait de la musique.", heritage: "Renforcement décisif de l'autorité monarchique.", tags: ["Richelieu", "Monarchie"] },
            { name: "Anne d'Autriche", era: "XVIIe siècle", dates: "1601 – 1666", role: "Reine et Régente de France", quote: "La fermeté au cœur de la Fronde.", bio: "Épouse de Louis XIII et mère de Louis XIV, elle assura la régence aux côtés du cardinal Mazarin.", anecdote: "Elle dut affronter la révolte de la Fronde qui faillit renverser le trône.", heritage: "Sauvegarde de la monarchie absolue naissante.", tags: ["Régente", "Fronde"] },
            { name: "Richelieu", era: "XVIIe siècle", dates: "1585 – 1642", role: "Cardinal et principal ministre", quote: "L'abaissement des grands et la grandeur de la France.", bio: "Ministre tout-puissant de Louis XIII, il matta les protestants, neutralisa la noblesse et fonda l'Académie française.", anecdote: "Il protégeait les arts tout en instaurant une police politique redoutable.", heritage: "Père de la raison d'État moderne.", tags: ["Cardinal", "Académie", "Raison d'État"] },
            { name: "Mazarin", era: "XVIIe siècle", dates: "1602 – 1661", role: "Cardinal et principal ministre", quote: "Négocier et durer pour triompher.", bio: "Successeur de Richelieu, d'origine italienne, il négocia les traités de Westphalie et écrasa la Fronde.", anecdote: "Il possédait une immense collection d'œuvres d'art et de livres rares.", heritage: "Consolidation de la puissance géopolitique française en Europe.", tags: ["Fronde", "Westphalie", "Ministre"] },
            { name: "Louis XIV", era: "XVIIe siècle", dates: "1638 – 1715", role: "Roi de France (Le Roi-Soleil)", quote: "L'État, c'est moi.", bio: "Le plus long règne de l'histoire européenne, symbole de la monarchie absolue et de la grandeur de Versailles.", anecdote: "Il dansait lui-même dans les ballets royaux durant sa jeunesse.", heritage: "Apogée de l'influence culturelle et politique française en Europe.", tags: ["Versailles", "Absolutisme", "Soleil"] },
            { name: "Colbert", era: "XVIIe siècle", dates: "1619 – 1683", role: "Contrôleur général des finances", quote: "Le travail et l'industrie pour enrichir le royaume.", bio: "Ministre de Louis XIV, créateur du mercantilisme (le colbertisme) et des grandes manufactures royales.", anecdote: "Il contrôlait chaque dépense de l'État avec une rigueur obsessionnelle.", heritage: "Développement économique et création de la marine de guerre.", tags: ["Colbertisme", "Finances", "Manufactures"] },
            { name: "Vauban", era: "XVIIe siècle", dates: "1633 – 1707", role: "Maréchal et ingénieur militaire", quote: "Ville assiégée par Vauban, ville prise ; ville fortifiée par Vauban, ville imprenable.", bio: "Génie militaire, il conçut la 'ceinture de fer' de fortifications protégeant les frontières françaises.", anecdote: "Il rédogea un projet révolutionnaire d'impôt unique pour tous (la dîme royale).", heritage: "Maître absolu de la poliorcétique (art des fortifications).", tags: ["Fortifications", "Ingénieur", "Maréchal"] },
            { name: "Turenne", era: "XVIIe siècle", dates: "1611 – 1675", role: "Maréchal de France", quote: "L'art de la guerre fondé sur la manœuvre et l'audace.", bio: "L'un des plus grands capitaines de l'histoire de France, maréchal général des camps et armées du roi.", anecdote: "Il se convertit au catholicisme à l'âge de 19 ans.", heritage: "Révolution des tactiques militaires au XVIIe siècle.", tags: ["Maréchal", "Tactique militaire"] },
            { name: "Condé", era: "XVIIe siècle", dates: "1621 – 1686", role: "Prince de Condé (Le Grand Condé)", quote: "La bravoure indomptable sur les champs de bataille.", bio: "Brillant général vainqueur à Rocroi dès l'âge de 22 ans, il oscilla entre loyauté royale et rébellion pendant la Fronde.", anecdote: "Ses charges de cavalerie furieuses étaient redoutées de toute l'Europe.", heritage: "Symbole de l'excellence militaire de la haute noblesse.", tags: ["Rocroi", "Le Grand Condé"] },
            { name: "Madame de Sévigné", era: "XVIIe siècle", dates: "1626 – 1696", role: "Écrivain épistolière", quote: "L'esprit et la tendresse au fil des lettres.", bio: "Célèbre pour ses *Lettres* adressées à sa fille, témoignage inestimable sur la vie mondaine et littéraire du Grand Siècle.", anecdote: "Elle excellait à raconter les menus faits de la cour avec un humour mordant.", heritage: "Chef-d'œuvre incontesté de la littérature épistolaire française.", tags: ["Lettres", "Épistolière", "Classicisme"] },
            { name: "Molière", era: "XVIIe siècle", dates: "1622 – 1673", role: "Dramaturge et comédien", quote: "Castigat ridendo mores (Il corrige les mœurs par le rire).", bio: "Génie de la comédie, auteur du *Misanthrope*, de *Tartuffe* et de *L'Avare*, protégé de Louis XIV.", anecdote: "Il fit un malaise mortel sur scène en jouant le rôle-titre du *Malade imaginaire*.", heritage: "Le père spirituel de la Comédie-Française.", tags: ["Théâtre", "Comédie", "Classicisme"] },
            { name: "Racine", era: "XVIIe siècle", dates: "1639 – 1699", role: "Dramaturge tragique", quote: "La peinture des passions humaines dans toute leur vérité.", bio: "Maître incontesté de la tragédie classique française (*Phèdre*, *Andromaque*, *Athalie*).", anecdote: "Il tomba en disgrâce auprès de Louis XIV pour s'être tourné vers des sujets trop austères.", heritage: "Sommet de la langue poétique classique.", tags: ["Tragédie", "Phèdre", "Classicisme"] },
            { name: "Corneille", era: "XVIIe siècle", dates: "1606 – 1684", role: "Dramaturge", quote: "À vaincre sans péril, on triomphe sans gloire.", bio: "Pionnier de la tragédie classique française, auteur du *Cid* et de *Horace*.", anecdote: "Le triomphe du *Cid* donna naissance à la fameuse 'querelle du Cid' littéraire.", heritage: "Exaltation de la volonté héroïque et de l'honneur.", tags: ["Le Cid", "Tragédie", "Héroïsme"] },
            { name: "Pascal", era: "XVIIe siècle", dates: "1623 – 1662", role: "Mathématicien, physicien et philosophe", quote: "Le cœur a ses raisons que la raison ne connaît point.", bio: "Génie précoce, inventeur de la première machine à calculer, auteur des *Pensées* et des *Provinciales*.", anecdote: "Il faillit périr noyé dans la Seine lorsque ses chevaux s'embourbèrent sur le pont de Neuilly.", heritage: "Pionnier du calcul des probabilités et géant de la philosophie religieuse.", tags: ["Mathématiques", "Philosophie", "Pensées"] },

            // Louis XIV et monarchie absolue
            { name: "Madame de Maintenon", era: "Louis XIV", dates: "1635 – 1719", role: "Épouse morganatique de Louis XIV", quote: "L'ascendant discret de la vertu et de la piété.", bio: "Ancienne gouvernante des enfants royaux, elle épousa secrètement Louis XIV à la fin de sa vie.", anecdote: "Elle fonda la prestigieuse maison d'éducation de Saint-Cyr pour les jeunes filles nobles.", heritage: "Influence morale et religieuse profonde sur la fin du règne.", tags: ["Morganatique", "Saint-Cyr", "Cour"] },
            { name: "Louvois", era: "Louis XIV", dates: "1641 – 1691", role: "Secrétaire d'État à la guerre", quote: "L'organisation de la machine militaire absolue.", bio: "Ministre de la Guerre de Louis XIV, il professionnalisa l'armée, créa les uniformes et systématisa les casernes.", anecdote: "Il fut le principal instigateur de la politique des 'réunions' et des ravages du Palatinat.", heritage: "Création d'une armée moderne, disciplinée et permanente.", tags: ["Guerre", "Armée", "Intendance"] },
            { name: "Fénelon", era: "Louis XIV", dates: "1651 – 1715", role: "Archevêque et pédagogue", quote: "Le roi doit servir son peuple et non l'inverse.", bio: "Précepteur du duc de Bourgogne, auteur des *Aventures de Télémaque*, critique audacieux de l'absolutisme.", anecdote: "Son livre fut perçu par Louis XIV comme une critique directe de sa politique.", heritage: "Précurseur des idées politiques des Lumières.", tags: ["Pédagogie", "Critique", "Télémaque"] },
            { name: "Bossuet", era: "Louis XIV", dates: "1627 – 1704", role: "Évêque et théologien", quote: "Le trône royal est le trône de Dieu même.", bio: "Grand orateur, précepteur du Dauphin, théoricien intransigeant du droit divin des rois.", anecdote: "Ses Oraisons funèbres sont des chefs-d'œuvre absolu de l'éloquence sacrée.", heritage: "Apologie théologique suprême de la monarchie absolue.", tags: ["Droit divin", "Orateur", "Absolutisme"] },
            { name: "Philippe d'Orléans", era: "Louis XIV", dates: "1640 – 1701", role: "Frère de Louis XIV (Monsieur)", quote: "L'éclat et le faste de la maison d'Orléans.", bio: "Frère cadet de Louis XIV, ancêtre de la branche d'Orléans, prince brillant et excentrique.", anecdote: "Il participa vaillamment à la bataille de Cassel tout en cultivant le goût du luxe et du théâtre.", heritage: "Fondateur de la lignée orléaniste.", tags: ["Monsieur", "Frère du roi"] },

            // XVIIIe siècle et Lumières
            { name: "Louis XV", era: "XVIIIe siècle & Lumières", dates: "1710 – 1774", role: "Roi de France", quote: "Après moi, le déluge.", bio: "Surnommé 'le Bien-Aimé' puis impopulaire, son règne fut marqué par l'essor des Lumières et des revers coloniaux.", anecdote: "Il passionnait pour la science, la botanique et la fabrication de serrures fines.", heritage: "Rayonnement culturel immense malgré les prémices de la crise financière.", tags: ["Le Bien-Aimé", "Lumières"] },
            { name: "Louis XVI", era: "XVIIIe siècle & Lumières", dates: "1754 – 1793", role: "Roi de France", quote: "Puisse mon sang cimenter le bonheur des Français.", bio: "Dernier roi de l'Ancien Régime, monarque bien intentionné mais dépassé par la tourmente révolutionnaire.", anecdote: "Il était passionné de serrurerie et de géographie.", heritage: "Chute de la monarchie absolue et avènement de la République.", tags: ["Révolution", "Procès", "Ancien Régime"] },
            { name: "Marie Leszczynska", era: "XVIIIe siècle & Lumières", dates: "1703 – 1768", role: "Reine de France", quote: "La discrétion et la piété au cœur de Versailles.", bio: "Princesse polonaise, épouse de Louis XV, mère de nombreux enfants royaux.", anecdote: "Elle introduisit l'usage des soirées musicales intimes à la cour.", heritage: "Maintien d'une cour pieuse et charitable.", tags: ["Reine", "Pologne"] },
            { name: "Madame de Pompadour", era: "XVIIIe siècle & Lumières", dates: "1721 – 1764", role: "Favorite de Louis XV et mécène", quote: "Protéger les arts et les philosophes des Lumières.", bio: "Favorite officielle et conseillère politique de Louis XV, protectrice active de l'Encyclopédie.", anecdote: "Elle joua un rôle clé dans le rapprochement diplomatique historique avec l'Autriche.", heritage: "Mécénat artistique exceptionnel (Manufacture de Sèvres).", tags: ["Favorite", "Encyclopédie", "Arts"] },
            { name: "Madame du Barry", era: "XVIIIe siècle & Lumières", dates: "1743 – 1793", role: "Favorite de Louis XV", quote: "La dernière favorite de l'Ancien Régime.", bio: "Dernière favorite officielle de Louis XV, femme d'une grande beauté et de grande influence mondaine.", anecdote: "Elle fut guillotinée sous la Terreur en montrant une grande frayeur.", heritage: "Symbole de la vie somptueuse de la fin de l'Ancien Régime.", tags: ["Favorite", "Terreur"] },
            { name: "Montesquieu", era: "XVIIIe siècle & Lumières", dates: "1689 – 1755", role: "Philosophe et magistrat", quote: "Pour qu'on ne puisse abuser du pouvoir, il faut que, par la disposition des choses, le pouvoir arrête le pouvoir.", bio: "Penseur politique majeur, théoricien de la séparation des pouvoirs dans *De l'esprit des lois*.", anecdote: "Il passa des années à voyager en Europe pour analyser les institutions politiques.", heritage: "Fondement de toutes les démocraties modernes.", tags: ["Séparation des pouvoirs", "Lumières"] },
            { name: "Voltaire", era: "XVIIIe siècle & Lumières", dates: "1694 – 1778", role: "Écrivain et philosophe", quote: "Écrasez l'infâme ! et battez-vous pour que je défende votre droit de le dire.", bio: "Chef de file des Lumières, ardent défenseur de la tolérance, de la liberté de penser et de la justice.", anecdote: "Il correspondait avec les plus grands monarques éclairés d'Europe, comme Frédéric II.", heritage: "Symbole universel de la liberté d'expression et de critique.", tags: ["Tolérance", "Lumières", "Philosophe"] },
            { name: "Jean-Jacques Rousseau", era: "XVIIIe siècle & Lumières", dates: "1712 – 1778", role: "Philosophe et écrivain", quote: "L'homme est né libre, et partout il est dans les fers.", bio: "Penseur du *Contrat social*, théoricien de la souveraineté du peuple et pionnier du romantisme.", anecdote: "Il aimait herboriser et observer la nature en marge des salons parisiens.", heritage: "Inspiration majeure de la démocratie moderne et de la Révolution.", tags: ["Contrat social", "Romantisme"] },
            { name: "Diderot", era: "XVIIIe siècle & Lumières", dates: "1713 – 1784", role: "Philosophe et encyclopédiste", quote: "Rassembler toutes les connaissances humaines.", bio: "Maître d'œuvre de l'immense *Encyclopédie* avec d'Alembert, critique d'art et penseur matérialiste.", anecdote: "Il dut faire face à la censure royale constante pour publier son grand œuvre.", heritage: "Diffusion universelle du savoir et de l'esprit critique.", tags: ["Encyclopédie", "Savoir", "Lumières"] },
            { name: "d'Alembert", era: "XVIIIe siècle & Lumières", dates: "1717 – 1783", role: "Mathématicien et philosophe", quote: "La science et la raison éclairant le monde.", bio: "Cofondateur et co-directeur de l'Encyclopédie, brillant mathématicien et physicien.", anecdote: "Abandonné enfant sur les marches d'une église, il fut élevé par une pauvre vitrière.", heritage: "Rigueur scientifique au service de la philosophie des Lumières.", tags: ["Mathématiques", "Encyclopédie"] },
            { name: "Beaumarchais", era: "XVIIIe siècle & Lumières", dates: "1732 – 1799", role: "Dramaturge et aventurier", quote: "Sans la liberté de blâmer, il n'est point d'éloge flatteur.", bio: "Auteur du *Mariage de Figaro*, homme d'affaires et fournisseur d'armes aux insurgés américains.", anecdote: "Il fut à la fois espion pour le roi, trafiquant d'armes et auteur à succès.", heritage: "Critique mordante des privilèges de la noblesse avant 1789.", tags: ["Figaro", "Théâtre", "Amériques"] },
            { name: "Buffon", era: "XVIIIe siècle & Lumières", dates: "1707 – 1788", role: "Naturaliste", quote: "Le style est l'homme même.", bio: "Auteur de la monumentale *Histoire naturelle*, il dirigea le Jardin du Roi à Paris.", anecdote: "Il écrivait en habits de marquis dans son cabinet de travail de Montbard.", heritage: "Pionnier de l'histoire naturelle moderne.", tags: ["Nature", "Sciences"] },
            { name: "Condorcet", era: "XVIIIe siècle & Lumières", dates: "1743 – 1794", role: "Philosophe et mathématicien", quote: "L'instruction publique, un droit pour tous les citoyens.", bio: "Mathématicien, figure des Lumières et révolutionnaire, ardent défenseur de l'instruction publique et des droits des femmes.", anecdote: "Il se cacha sous la Terreur avant d'être arrêté et de mourir mystérieusement en prison.", heritage: "Fondation de l'école républicaine et laïque.", tags: ["Instruction", "Droits", "Révolution"] },
            { name: "Olympe de Gouges", era: "XVIIIe siècle & Lumières", dates: "1748 – 1793", role: "Femme de lettres et féministe", quote: "La femme a le droit de monter sur l'échafaud ; elle doit avoir également celui de monter à la tribune.", bio: "Pionnière du féminisme, rédactrice de la *Déclaration des droits de la femme et de la citoyenne* en 1791.", anecdote: "Elle fut guillotinée pour ses prises de position politiques modérées sous la Terreur.", heritage: "Figure pionnière de l'émancipation des femmes.", tags: ["Féminisme", "Droits de la femme", "Terreur"] },

            // Révolution américaine — contexte
            { name: "George Washington", era: "Révolution américaine — contexte", dates: "1732 – 1999" /* 1799 */, role: "Général et 1er Président des États-Unis", role_clean: "Général et 1er Président des États-Unis", quote: "La liberté est un feu qui s'entretient.", bio: "Commandant en chef des troupes insurgées américaines, allié précieux de la France de Louis XVI.", anecdote: "Il refusa d'effectuer un troisième mandat présidentiel pour préserver la république.", heritage: "Fondateur des États-Unis d'Amérique.", tags: ["USA", "Indépendance", "Général"] },
            { name: "Benjamin Franklin", era: "Révolution américaine — contexte", dates: "1706 – 1790", role: "Diplomate et savant américain", quote: "L'énergie et la perspicacité vainquent toutes choses.", bio: "Ambassadeur des Insurgents à Paris, il séduisit la cour de Louis XVI et les salons philosophiques.", anecdote: "Il popularisa le paratonnerre et maniait l'esprit avec un immense talent.", heritage: "Alliance franco-américaine décisive.", tags: ["Diplomatie", "USA", "Lumières"] },
            { name: "Thomas Jefferson", era: "Révolution américaine — contexte", dates: "1743 – 1826", role: "Principal auteur de la Déclaration d'indépendance", quote: "La vie, la liberté et la recherche du bonheur.", bio: "Père fondateur américain, ambassadeur en France, grand lecteur des philosophes des Lumières.", anecdote: "Il acheta plus tard la Louisiane à la France napoléonienne.", heritage: "Rédaction des principes fondamentaux de la démocratie américaine.", tags: ["Déclaration", "USA"] },
            { name: "La Fayette", era: "Révolution américaine — contexte", dates: "1757 – 1834", role: "Général et homme politique", quote: "Le héros des deux mondes.", bio: "Jeune aristocrate enthousiaste parti combattre aux côtés des Américains avant de jouer un rôle central en 1789.", anecdote: "Il traversa l'Atlantique à bord de son propre navire, la *Victoire*.", heritage: "Lien vivant entre les révolutions américaine et française.", tags: ["Héros", "USA", "Révolution"] },
            { name: "Rochambeau", era: "Révolution américaine — contexte", dates: "1725 – 1807", role: "Maréchal de France", quote: "La discipline et l'efficacité militaire au service de Yorktown.", bio: "Commandant du corps expéditionnaire français envoyé en Amérique pour soutenir Washington.", anecdote: "Il coordonna avec brio le piège stratégique de Yorktown contre les Britanniques.", heritage: "Victoire décisive de l'indépendance américaine.", tags: ["Yorktown", "Maréchal", "USA"] },

            // Révolution française
            { name: "Louis XVI", era: "Révolution française", dates: "1754 – 1793", role: "Roi déchu de France", quote: "Je suis innocent de ce qu'on m'inculpe.", bio: "Jugé par la Convention nationale, il fut condamné à mort et exécuté en janvier 1793.", anecdote: "Ses derniers mots furent étouffés par le roulement des tambours de Santerre.", heritage: "Fin définitive de la monarchie en France.", tags: ["Procès", "Guillotine", "Convention"] },
            { name: "Marie-Antoinette", era: "Révolution française", dates: "1755 – 1793", role: "Reine de France", quote: "Courage, j'ai traversé bien des épreuves.", bio: "Reine autrichienne impopulaire, jugée et guillotinée quelques mois après son époux.", anecdote: "Elle perdit sa chaussure en montant sur l'échafaud et s'excusa auprès du bourreau.", heritage: "Symbole tragique de la chute de l'Ancien Régime.", tags: ["Reine", "Guillotine", "Autriche"] },
            { name: "Necker", era: "Révolution française", dates: "1732 – 1804", role: "Banquier et ministre des Finances", quote: "La transparence financière pour sauver l'État.", bio: "Ministre réformateur suisse, très populaire auprès du peuple, dont le renvoi provoqua la prise de la Bastille.", anecdote: "Il publia pour la première fois le compte rendu des dépenses secrètes de la cour.", heritage: "Catalyseur involontaire des journées révolutionnaires.", tags: ["Finances", "Bastille", "Suisse"] },
            { name: "Mirabeau", era: "Révolution française", dates: "1749 – 1791", role: "Orateur et député révolutionnaire", quote: "Nous sommes ici par la volonté du peuple, nous n'en sortirons que par la force des bayonnettes.", bio: "Tribun charismatique de la Révolution, il tenta secrètement de concilier la royauté et l'Assemblée.", anecdote: "Il avait une tête énorme et une voix tonitruante qui électrisait l'Assemblée.", heritage: "Première grande voix parlementaire de la Révolution.", tags: ["Orateur", "Assemblée"] },
            { name: "Sieyès", era: "Révolution française", dates: "1748 – 1836", role: "Abbé et homme politique", quote: "Qu'est-ce que le Tiers-État ? Tout. Qu'a-t-il été jusqu'à présent dans l'ordre politique ? Rien. Que demande-t-il ? À y devenir quelque chose.", bio: "Auteur du pamphlet décisif de 1789, acteur clé du coup d'État du 18 Brumaire.", anecdote: "Interrogé sur ce qu'il avait fait pendant la Terreur, il répondit simplement : 'J'ai vécu'.", heritage: "Architecte des grands bouleversements constitutionnels.", tags: ["Tiers-État", "18 Brumaire"] },
            { name: "Lafayette", era: "Révolution française", dates: "1757 – 1834", role: "Commandant de la Garde nationale", quote: "Le maintien de l'ordre et de la liberté.", bio: "Commandant de la Garde nationale parisienne en 1789, père de la cocarde tricolore.", anecdote: "Il offrit la clé de la Bastille détruite à son ami George Washington.", heritage: "Créateur des symboles de la France révolutionnaire.", tags: ["Garde nationale", "Tricolore"] },
            { name: "Barnave", era: "Révolution française", dates: "1761 – 1793", role: "Député et orateur", quote: "Le sang qui coule est-il donc si pur ?", bio: "Brillant orateur du début de la Révolution, partisan d'une monarchie constitutionnelle modérée.", anecdote: "Il fut guillotiné après avoir été compromis par les papiers secrets trouvés aux Tuileries.", heritage: "Tragédie des modérés pris dans la radicalisation.", tags: ["Modéré", "Guillotine"] },
            { name: "Bailly", era: "Révolution française", dates: "1736 – 1793", role: "Premier maire de Paris", quote: "Le serment du Jeu de paume gravé dans l'histoire.", bio: "Astronome et premier maire de Paris, président de l'Assemblée nationale constituante.", anecdote: "Il fut exécuté sous la Terreur sur le Champ-de-Mars dans le froid et la boue.", heritage: "Symbole de la probité bourgeoise républicaine.", tags: ["Maire de Paris", "Jeu de paume"] },
            { name: "Danton", era: "Révolution française", dates: "1759 – 1794", role: "Homme politique et tribun", quote: "De l'audace, encore de l'audace, toujours de l'audace !", bio: "Orateur tonitruant, ministre de la Justice, l'un des principaux artisans de la défense de la République en 1792.", anecdote: "Il lança au bourreau avant d'être exécuté : 'Montre ma tête au peuple, elle en vaut la peine !'", heritage: "Énergie révolutionnaire et patriotique incarnée.", tags: ["Audace", "Terreur", "Tribun"] },
            { name: "Marat", era: "Révolution française", dates: "1743 – 1793", role: "Journaliste et député", quote: "L'ami du peuple veille pour détruire la trahison.", bio: "Journaliste radical ultra-populaire (*L'Ami du peuple*), fervent partisan de l'élimination des ennemis de la Révolution.", anecdote: "Il passait des heures dans sa baignoire pour soigner une maladie de peau débilitante.", heritage: "Incarne la voix radicale et vengeresse de la plèbe parisienne.", tags: ["Journaliste", "Ami du peuple"] },
            { name: "Robespierre", era: "Révolution française", dates: "1758 – 1794", role: "Avocat et membre du Comité de salut public", quote: "La vertu sans laquelle la terreur est funeste, la terreur sans laquelle la vertu est impuissante.", bio: "Surnommé 'l'Incorruptible', figure centrale de la Terreur révolutionnaire avant d'être abattu au 9 Thermidor.", anecdote: "Il vivait modestement chez un menuisier parisien rue Saint-Honoré.", heritage: "L'ambivalence tragique de la radicalité révolutionnaire.", tags: ["Incorruptible", "Terreur", "Thermidor"] },
            { name: "Desmoulins", era: "Révolution française", dates: "1760 – 1794", role: "Journaliste et révolutionnaire", quote: "Aux armes ! Prenez des feuilles vertes !", bio: "Il appela le peuple à l'insurrection au Palais-Royal en juillet 1789, initiant la prise de la Bastille.", anecdote: "Il fut guillotiné aux côtés de Danton après avoir tenté de modérer la Terreur.", heritage: "Le verbe enflammé de la Révolution naissante.", tags: ["Palais-Royal", "Journaliste"] },
            { name: "Saint-Just", era: "Révolution française", dates: "1767 – 1794", role: "Homme politique et conventionnel", quote: "Le bonheur est une idée neuve en Europe.", bio: "Surnommé 'l'Archange de la Révolution', jeune théoricien intransigeant de la Terreur et bras droit de Robespierre.", anecdote: "Il affichait un calme glacial et une élégance aristocratique à la tribune.", heritage: "L'absolutisme moral et politique poussé à l'extrême.", tags: ["Archange", "Terreur"] },
            { name: "Hébert", era: "Révolution française", dates: "1757 – 1794", role: "Journaliste et révolutionnaire", quote: "La colère du Père Duchesne contre les corrompus.", bio: "Chef de file des ultra-révolutionnaires (les Hébertistes), rédacteur du journal pamphlétaire *Le Père Duchesne*.", anecdote: "Son journal employait un langage argotique et très cru pour séduire le peuple.", heritage: "Extrémisme populaire et déchristianisateur.", tags: ["Père Duchesne", "Hébertistes"] },
            { name: "Fouché", era: "Révolution française", dates: "1759 – 1820", role: "Ministre de la Police", quote: "Le vice appuyé sur le génie de la survie politique.", bio: "Ancien conventionnel régicide, maître absolu des machinations policières sous la Révolution, l'Empire et la Restauration.", anecdote: "Il vota la mort de Louis XVI avant de servir tous les régimes avec la même efficacité cynique.", heritage: "L'archétype du politicien sans principes mais indispensable.", tags: ["Police", "Survie politique"] },
            { name: "Carnot", era: "Révolution française", dates: "1753 – 1823", role: "Mathématicien et organisateur de la victoire", quote: "Organiser le triomphe des armées de la République.", bio: "Génie militaire et scientifique, il organisa la levée en masse et redressa les armées républicaines.", anecdote: "Surnommé 'l'organisateur de la victoire' sous le Directoire.", heritage: "Fondement de l'efficacité militaire moderne.", tags: ["Victoire", "Armées"] },
            { name: "Brissot", era: "Révolution française", dates: "1754 – 1793", role: "Chef du clan des Girondins", quote: "Étendre la liberté par la guerre européenne.", bio: "Chef de file du parti girondin, partisan d'une politique belliqueuse pour diffuser les idéaux révolutionnaires.", anecdote: "Il fut l'un des premiers grands abolitionnistes français au sein de la Société des amis des noirs.", heritage: "Destin tragique des Girondins éliminés par la Montagne.", tags: ["Girondins", "Abolitionnisme"] },
            { name: "Vergniaud", era: "Révolution française", dates: "1753 – 1793", role: "Avocat et orateur girondin", quote: "La Révolution est comme Saturne, elle dévore ses propres enfants.", bio: "L'une des plus belles plumes et voix de la Gironde à la tribune de la Convention.", anecdote: "Il prononça des discours d'une éloquence bouleversée avant d'être guillotiné.", heritage: "Sommet de l'éloquence parlementaire républicaine modérée.", tags: ["Gironde", "Orateur"] },
            { name: "Charlotte Corday", era: "Révolution française", dates: "1768 – 1793", role: "Meurtrière de Marat", quote: "J'ai tué un homme pour en sauver cent mille.", bio: "Jeune Normande monarchiste, elle poignarda Jean-Paul Marat dans sa baignoire en juillet 1793.", anecdote: "Elle fut qualifiée 'd'ange de l'assassinat' par ses juges avant d'être exécutée.", heritage: "Symbole de la résistance individuelle au tyran.", tags: ["Marat", "Assassinat", "Guillotine"] },
            { name: "Manon Roland", era: "Révolution française", dates: "1754 – 1793", role: "Figure intellectuelle des Girondins", quote: "Ô liberté, que de crimes on commet en ton nom !", bio: "Salonnière brillante, inspiratrice du parti girondin, femme de caractère au destin tragique.", anecdote: "Ses derniers mots célèbres furent prononcés devant la statue de la Liberté avant de monter à l'échafaud.", heritage: "Incarne l'engagement intellectuel des femmes dans la Révolution.", tags: ["Gironde", "Salon", "Liberté"] },
            { name: "Rouget de Lisle", era: "Révolution française", dates: "1760 – 1836", role: "Officier et auteur de La Marseillaise", quote: "Aux armes, citoyens, formez vos bataillons !", bio: "Officier du génie, il composa en quelques heures le *Chant de guerre pour l'armée du Rhin*, futur hymne national.", anecdote: "Il composa son chant à Strasbourg à la demande du maire Dietrich.", heritage: "Création de l'hymne national français immortel.", tags: ["Marseillaise", "Hymne"] },
            { name: "Gracchus Babeuf", era: "Révolution française", dates: "1760 – 1797", role: "Révolutionnaire et précurseur du socialisme", quote: "Le but de la Révolution est de détruire l'inégalité et de faire jouir tout le monde du bonheur.", bio: "Organisateur de la 'Conspiration des Égaux', partisan d'une égalité stricte et de la suppression de la propriété privée.", anecdote: "Il fut guillotiné sous le Directoire pour avoir fomenté un soulèvement populaire.", heritage: "Précurseur direct du communisme moderne.", tags: ["Égalité", "Socialisme", "Directoire"] },

            // Napoléon
            { name: "Napoléon Bonaparte", era: "Napoléon", dates: "1769 – 1821", role: "Empereur des Français", quote: "Impossible n'est pas français.", bio: "Général de génie, il prit le pouvoir par le coup d'État du 18 Brumaire et fonda l'Empire.", anecdote: "Il dicta ses mémoires à Sainte-Hélène en comparant ses exploits à ceux de César.", heritage: "Création des institutions modernes (Code Civil, lycées, préfets).", tags: ["Empire", "Austerlitz", "Code Civil"] },
            { name: "Joséphine de Beauharnais", era: "Napoléon", dates: "1763 – 1814", role: "Impératrice des Français", quote: "Le charme et l'élégance au sommet de l'Empire.", bio: "Première épouse de Napoléon, reine de l'élégance parisienne, répudiée pour défaut d'héritier.", anecdote: "Elle entretenait une passion pour la botanique dans son domaine de Malmaison.", heritage: "Icône de la mode de style Directoire et Empire.", tags: ["Impératrice", "Malmaison"] },
            { name: "Talleyrand", era: "Napoléon", dates: "1754 – 1838", role: "Diplomate et ministre", quote: "L'art de trahir tous les régimes avec élégance et profit.", bio: "Surnommé 'le diable boiteux', ministre des Affaires étrangères, maître absolu de la diplomatie européenne.", anecdote: "Il survécut à toutes les transitions politiques de 1789 à la monarchie de Juillet.", heritage: "Définition moderne de l'art diplomatique de l'équilibre.", tags: ["Diplomatie", "Chauve-souris politique"] },
            { name: "Cambacérès", era: "Napoléon", dates: "1753 – 1824", role: "Jurisconsulte et archichancelier", quote: "Rédiger les lois civiles de la France moderne.", bio: "Juriste éminent, principal artisan de la rédaction du Code civil napoléonien.", anecdote: "Il menait une vie de grand gastronome raffiné à Paris.", heritage: "Fondement de notre droit civil contemporain.", tags: ["Code civil", "Juriste"] },
            { name: "Murat", era: "Napoléon", dates: "1767 – 1815", role: "Maréchal d'Empire et Roi de Naples", quote: "La bravoure étourdissante de la cavalerie.", bio: "Maréchal d'Empire intrépide, beau-frère de Napoléon, célèbre pour ses charges de cavalerie flamboyantes.", anecdote: "Il portait des uniformes aux plumets immenses et chamarrés pour galvaniser ses hommes.", heritage: "L'archétype du hussard intrépide et panache napoléonien.", tags: ["Maréchal", "Cavalerie", "Naples"] },
            { name: "Ney", era: "Napoléon", dates: "1769 – 1815", role: "Maréchal d'Empire", quote: "Le brave des braves.", bio: "L'un des maréchaux les plus intrépides de Napoléon, héroïque lors de la terrible retraite de Russie.", anecdote: "Il commanda l'arrière-garde de la Grande Armée en tenant personnellement un fusil.", heritage: "Légende de la bravoure militaire française.", tags: ["Brave des braves", "Maréchal"] },
            { name: "Davout", era: "Napoléon", dates: "1770 – 1823", role: "Maréchal d'Empire", quote: "La rigueur et la victoire à Auerstedt.", bio: "Maréchal d'Empire intransigeant et incorruptible, vainqueur écrasé de supériorité numérique à Auerstedt.", anecdote: "Il ne buvait que de l'eau et exigeait une discipline de fer de ses troupes.", heritage: "Le plus redoutable tacticien de l'armée napoléonienne.", tags: ["Auerstedt", "Maréchal", "Rigueur"] },
            { name: "Desaix", era: "Napoléon", dates: "1768 – 1800", role: "Général de division", quote: "La bataille est perdue, mais il est temps d'en gagner une autre.", bio: "Brillant général républicain, sa charge opportune sauva Napoléon à la bataille de Marengo.", anecdote: "Il mourut au moment précis de la victoire en plein cœur de la mêlée.", heritage: "L'incarnation de la loyauté militaire républicaine.", tags: ["Marengo", "Général"] },
            { name: "Berthier", era: "Napoléon", dates: "1753 – 1815", role: "Maréchal et major général de la Grande Armée", quote: "L'esprit d'organisation derrière le génie tactique.", bio: "Chef d'état-major général de Napoléon, infatigable coordinateur des mouvements de la Grande Armée.", anecdote: "Il pouvait dicter des ordres à plusieurs secrétaires en même temps sans se tromper.", heritage: "Inventeur moderne de la fonction d'état-major.", tags: ["État-major", "Logistique"] },
            { name: "Wellington", era: "Napoléon", dates: "1769 – 1852", role: "Général britannique et Duc de Wellington", quote: "La tenacité britannique sur le champ de bataille.", bio: "Vainqueur de Napoléon à Waterloo, commandant en chef des forces coalisées.", anecdote: "Surnommé 'le Duc de Fer' en raison de son intransigeance.", heritage: "Stoppeur définitif de l'épopée impériale.", tags: ["Waterloo", "Angleterre", "Duc de Fer"] },
            { name: "Alexandre Ier de Russie", era: "Napoléon", dates: "1777 – 1825", role: "Tsar de Russie", quote: "L'énigmatique adversaire de l'Empereur.", bio: "Souverain russe, d'abord allié puis ennemi mortel de Napoléon lors de la campagne de Russie en 1812.", anecdote: "Il oscillait entre mysticisme religieux et réformes politiques libérales.", heritage: "Architecte de la chute finale de l'Empire.", tags: ["Russie", "1812", "Tsar"] },
            { name: "Metternich", era: "Napoléon", dates: "1773 – 1859", role: "Chancelier autrichien", quote: "L'art de l'équilibre européen et de la conservation.", bio: "Chancelier autrichien, maître d'œuvre du congrès de Vienne pour restaurer l'ordre ancien en Europe.", anecdote: "Il considérait la Révolution et le nationalisme comme une maladie contagieuse.", heritage: "Architecte de la réaction conservatrice européenne.", tags: ["Autriche", "Congrès de Vienne"] },

            // XIXe siècle
            { name: "Louis XVIII", era: "XIXe siècle", dates: "1755 – 1824", role: "Roi de France", quote: "Union et oubli pour panser les plaies de la France.", bio: "Frère de Louis XVI, restauré sur le trône en 1814, octroyant la Charte constitutionnelle.", anecdote: "Il était un grand amateur de bonne chère et d'ouvrages classiques latins.", heritage: "Instauration de la monarchie constitutionnelle modérée.", tags: ["Restauration", "Charte"] },
            { name: "Charles X", era: "XIXe siècle", dates: "1757 – 1836", role: "Roi de France", quote: "Ne jamais changer d'avis, c'est l'erreur suprême de l'Ancien Régime.", bio: "Dernier roi de la branche aînée des Bourbons, chassé par les Trois Glorieuses de juillet 1830.", anecdote: "Il fut le dernier roi de France à être sacré solennellement à Reims en 1825.", heritage: "Échec final du retour à l'Ancien Régime.", tags: ["1830", "Trois Glorieuses", "Reims"] },
            { name: "Louis-Philippe", era: "XIXe siècle", dates: "1773 – 1850", role: "Roi des Français", quote: "Le roi citoyen au service de la bourgeoisie.", bio: "Surnommé 'le Roi Citoyen' ou le 'roi bourgeois', il régna lors de la monarchie de Juillet jusqu'en 1848.", anecdote: "Il se promenait dans les rues de Paris un parapluie sous le bras comme un bourgeois.", heritage: "Essor fulgurant de la bourgeoisie industrielle et financière.", tags: ["Roi Citoyen", "Monarchie de Juillet"] },
            { name: "Adolphe Thiers", era: "XIXe siècle", dates: "1797 – 1877", role: "Homme politique et historien", quote: "La république sera conservative ou elle ne sera pas.", bio: "Historien de la Révolution, premier président de la IIIe République, tristement célèbre pour la répression de la Commune.", anecdote: "Il mesurait à peine un mètre cinquante mais possédait une énergie verbale foudroyante.", heritage: "Fondation et stabilisation difficile de la IIIe République.", tags: ["Commune", "Président", "IIIe République"] },
            { name: "François Guizot", era: "XIXe siècle", dates: "1787 – 1874", role: "Historien et homme politique", quote: "Enrichissez-vous par le travail et par l'épargne.", bio: "Ministre influent de Louis-Philippe, chantre du libéralisme censitaire et conservateur.", anecdote: "Sa formule célèbre fut souvent mal comprise comme une apologie exclusive de l'argent.", heritage: "Modèle politique de la monarchie bourgeoise.", tags: ["Libéralisme", "Enrichissez-vous"] },
            { name: "Lamartine", era: "XIXe siècle", dates: "1790 – 1869", role: "Poète et homme politique", quote: "Le drapeau tricolore a fait le tour du monde avec la république.", bio: "Poète romantique de premier plan, chef de file du gouvernement provisoire de 1848.", anecdote: "Il écarta d'un geste sublime le drapeau rouge pour maintenir le drapeau tricolore à l'Hôtel de Ville.", heritage: "Alliant le lyrisme poétique à l'idéalisme républicain.", tags: ["Poète", "1848", "Romantisme"] },
            { name: "George Sand", era: "XIXe siècle", dates: "1804 – 1876", role: "Écrivain", quote: "La liberté de créer, d'aimer et de penser en s'affranchissant des codes.", bio: "Romancière majeure du XIXe siècle, féministe avant l'heure, menant une vie scandaleusement libre.", anecdote: "Elle portait des vêtements d'homme et fumait la pipe en public pour travailler incognito.", heritage: "Émancipation littéraire et sociale des femmes.", tags: ["Romancière", "Féminisme", "Nohant"] },
            { name: "Victor Hugo", era: "XIXe siècle", dates: "1802 – 1885", role: "Écrivain et homme politique", quote: "C'est la nuit qu'il est beau de croire à la lumière.", bio: "Chef de file du romantisme français, auteur des *Misérables* et ardent défenseur de la République.", anecdote: "Il vécut en exil sur l'île de Jersey et Guernesey pendant plus de 15 ans.", heritage: "Monument incontesté de la littérature et de la conscience républicaine.", tags: ["Romantisme", "Littérature", "Misérables"] },
            { name: "Alexandre Dumas", era: "XIXe siècle", dates: "1802 – 1870", role: "Écrivain", quote: "Tous pour un, un pour tous.", bio: "Maître incontesté du roman historique populaire (*Les Trois Mousquetaires*, *Le Comte de Monte-Cristo*).", anecdote: "Il fit construire un château fantasque près de Marly qu'il baptisa 'Monte-Cristo'.", heritage: "Immense popularité universelle du roman d'aventure.", tags: ["Mousquetaires", "Roman", "Aventures"] },
            { name: "Eugène Delacroix", era: "XIXe siècle", dates: "1798 – 1863", role: "Peintre romantique", quote: "La liberté guidant le peuple sur les barricades.", bio: "Chef de file de la peinture romantique française, immortalisant les révolutions parisiennes.", anecdote: "Son tableau le plus célèbre fut acquis par l'État avant d'être longtemps remisé.", heritage: "Sommet de l'expressionnisme pictural romantique.", tags: ["Peinture", "Romantisme", "Liberté"] },
            { name: "Louis-Napoléon Bonaparte", era: "XIXe siècle", dates: "1808 – 1873", role: "Président puis Empereur des Français", quote: "L'Empire, c'est la paix.", bio: "Neveu de Napoléon Ier, élu président en 1848, il réalisa le coup d'État de 1851 pour fonder le Second Empire.", anecdote: "Il écrivit de nombreux traités politiques utopiques pendant sa détention au fort de Ham.", heritage: "Modernisation économique et industrielle fulgurante de la France.", tags: ["Second Empire", "1851", "Napoléon III"] },
            { name: "Napoléon III", era: "XIXe siècle", dates: "1808 – 1873", role: "Empereur des Français", quote: "Transformer Paris et moderniser la France.", bio: "Souverain du Second Empire, il métamorphosa Paris avec le baron Haussmann et développa les chemins de fer.", anecdote: "Il fut fait prisonnier par les Prussiens à Sedan en 1870.", heritage: "Révolution industrielle et urbaine majeure de la France.", tags: ["Second Empire", "Sedan", "Modernisation"] },
            { name: "Haussmann", era: "XIXe siècle", dates: "1809 – 1891", role: "Préfet de la Seine", quote: "Percer Paris pour l'aérer, l'unifier et l'embellir.", bio: "Préfet visionnaire sous Napoléon III, il métamorphosa le visage de Paris en traçant de grands boulevards modernes.", anecdote: "Ses travaux colossaux entraînèrent l'expropriation de milliers de foyers populaires.", heritage: "Le visage haussmannien actuel de Paris.", tags: ["Paris", "Boulevards", "Urbanisme"] },
            { name: "Gustave Eiffel", era: "XIXe siècle", dates: "1832 – 1923", role: "Ingénieur et constructeur", quote: "Le fer dressé vers le ciel.", bio: "Ingénieur de génie, concepteur de la célèbre tour Eiffel érigée pour l'Exposition universelle de 1889.", anecdote: "Il fut vivement critiqué par de nombreux artistes et écrivains qui trouvaient sa tour monstrueuse.", heritage: "Symbole universel de la France et de l'architecture métallique.", tags: ["Tour Eiffel", "Ingénieur", "1889"] },
            { name: "Jules Ferry", era: "XIXe siècle", dates: "1832 – 1893", role: "Homme politique", quote: "L'instruction gratuite, laïque et obligatoire pour tous les enfants.", bio: "Ministre de l'Instruction publique, architecte de l'école républicaine moderne et partisan de l'expansion coloniale.", anecdote: "Il fut la cible d'un attentat manqué en plein parlement.", heritage: "Fondation de l'école laïque et républicaine.", tags: ["École", "Laïcité", "IIIe République"] },
            { name: "Léon Gambetta", era: "XIXe siècle", dates: "1838 – 1882", role: "Homme politique républicain", quote: "Le péril clérical, voilà l'ennemi ! et vive la République !", bio: "Tribun passionné de la défense nationale en 1870, fondateur de la IIIe République.", anecdote: "Il s'échappa de Paris assiégé à bord d'un ballon monté pour organiser la résistance en province.", heritage: "Ancrage définitif de la démocratie républicaine en France.", tags: ["République", "Tribun", "Ballon"] },
            { name: "Louise Michel", era: "XIXe siècle", dates: "1830 – 1905", role: "Institutrice et militante anarchiste", quote: "La révolution sera sociale ou ne sera pas.", bio: "Figure héroïque de la Commune de Paris, déportée au bagne de Nouvelle-Calédonie.", anecdote: "Surnommé 'la Vierge rouge', elle défendit courageusement ses idées devant ses juges militaires.", heritage: "Icône de l'anarchisme et du féminisme révolutionnaire.", tags: ["Commune", "Anarchisme", "Vierge rouge"] },
            { name: "Auguste Blanqui", era: "XIXe siècle", dates: "1805 – 1881", role: "Révolutionnaire socialiste", quote: "L'Enfermé au service de la révolution permanente.", bio: "Surnommé 'l'Enfermé', militant révolutionnaire professionnel ayant passé la moitié de sa vie en prison.", anecdote: "Il fut élu député alors même qu'il était incarcéré.", heritage: "Symbole de la lutte insurrectionnelle ouvrière.", tags: ["Socialisme", "Insurrection"] },
            { name: "Karl Marx", era: "XIXe siècle", dates: "1818 – 1883", role: "Philosophe et théoricien du socialisme", quote: "Prolétaires de tous les pays, unissez-vous !", bio: "Exilé de longue date à Londres et à Paris, auteur du *Capital* et du *Manifeste du parti communiste*.", anecdote: "Il passa de longues journées à travailler dans la salle de lecture du British Museum.", heritage: "Fondement théorique du mouvement ouvrier et communiste mondial.", tags: ["Marxism", "Capital", "Socialisme"] },

            // IIIe République
            { name: "Georges Clemenceau", era: "IIIe République", dates: "1841 – 1929", role: "Président du Conseil (Le Tigre)", quote: "La guerre ! C'est l'heure des actes et du salut national.", bio: "Surnommé 'Le Tigre', ardent défenseur de Dreyfus, père de la victoire de 1918.", anecdote: "Il fit tomber de nombreux gouvernements avant de diriger la France à la fin de la Grande Guerre.", heritage: "Incarne la rigueur républicaine et la victoire militaire.", tags: ["Le Tigre", "Victoire", "1918"] },
            { name: "Raymond Poincaré", era: "IIIe République", dates: "1860 – 1934", role: "Président de la République", quote: "L'union sacrée face à l'agression.", bio: "Président de la République pendant la Première Guerre mondiale, symbole de la fermeté patriotique.", anecdote: "Il conservait un sang-froid légendaire face aux pires crises diplomatiques.", heritage: "Stabilité institutionnelle en temps de guerre.", tags: ["Union sacrée", "Président"] },
            { name: "Joseph Joffre", era: "IIIe République", dates: "1852 – 1931", role: "Maréchal de France", quote: "Le vainqueur de la Marne au calme imperturbable.", bio: "Commandant en chef des armées françaises au début de la Première Guerre mondiale, vainqueur de la bataille de la Marne.", anecdote: "Surnommé 'Papa Joffre', son flegme légendaire rassurait les troupes.", heritage: "Sauvetage de Paris en 1914.", tags: ["Marne", "1914", "Maréchal"] },
            { name: "Philippe Pétain", era: "IIIe République", dates: "1856 – 1951", role: "Maréchal de France", quote: "Ils ne passeront pas !", bio: "Héroïque vainqueur de la bataille de Verdun en 1916 avant de sombrer dans la collaboration en 1940.", anecdote: "Il devint l'idole des poilus avant de connaître une disgrâce historique totale.", heritage: "Trajectoire tragique entre le sommet de la gloire et la trahison.", tags: ["Verdun", "Héros puis traître"] },
            { name: "Ferdinand Foch", era: "IIIe République", dates: "1851 – 1929", role: "Maréchal de France et généralissime", quote: "Mon centre cède, ma droite recule, situation excellente, j'attaque.", bio: "Commandant suprême des forces alliées en 1918, artisan majeur de la victoire finale.", anecdote: "Il signa l'armistice dans le fameux wagon de Rethondes.", heritage: "Stratège suprême de la victoire de la Grande Guerre.", tags: ["Armistice", "Maréchal", "1918"] },
            { name: "Robert Nivelle", era: "IIIe République", dates: "1856 – 1924", role: "Général en chef", quote: "La percée décisive et le désastre du Chemin des Dames.", bio: "Promu général en chef en 1916, son offensive ratée du Chemin des Dames provoqua des mutineries massives.", anecdote: "Il promettait de percer les lignes ennemies en 48 heures avant l'échec sanglant.", heritage: "Le symbole des erreurs tactiques meurtrières de 1917.", tags: ["Chemin des Dames", "Mutineries"] },
            { name: "Jean Jaurès", era: "IIIe République", dates: "1859 – 1914", role: "Homme politique et socialiste", quote: "Le courage, c'est de chercher la vérité et de la dire.", bio: "Grand tribun socialiste, pacifiste convaincu, assassiné à la veille de la Première Guerre mondiale.", anecdote: "Il fut abattu par un nationaliste exalté dans un café de la rue Montmartre.", heritage: "Icône de la gauche pacifiste, sociale et républicaine.", tags: ["Socialisme", "Pacifisme", "Assassinat"] },
            { name: "Guillaume II", era: "IIIe République", dates: "1859 – 1941", role: "Empereur d'Allemagne (Kaiser)", quote: "La force et la grandeur de l'Empire allemand.", bio: "Dernier empereur allemand, belliqueux et nationaliste, responsable de la politique d'agression menant à 1914.", anecdote: "Il portait en permanence une moustache flamboyante et un casque à pointe.", heritage: "Déclenchement du cataclysme de la Grande Guerre.", tags: ["Allemagne", "Kaiser", "1914"] },
            { name: "Woodrow Wilson", era: "IIIe République", dates: "1856 – 1924", role: "Président des États-Unis", quote: "Le droit des peuples à disposer d'eux-mêmes.", bio: "Président américain, partisan de l'entrée en guerre des USA en 1917 et créateur de la SDN.", anecdote: "Il formula ses fameux 'quatorze points' pour bâtir la paix mondiale.", heritage: "Introduction de l'idéalisme diplomatique moderne.", tags: ["USA", "SDN", "Paix"] },
            { name: "Émile Zola", era: "IIIe République", dates: "1840 – 1902", role: "Écrivain", quote: "J'accuse... !", bio: "Chef de file du naturalisme, auteur de la fresque des *Rougon-Macquart*, défenseur héroïque de Dreyfus.", anecdote: "Il dut s'exiler à Londres pour échapper à une condamnation judiciaire après son 'J'accuse'.", heritage: "Incarne l'intellectuel engagé au service de la justice.", tags: ["J'accuse", "Dreyfus", "Naturalisme"] },
            { name: "Alfred Dreyfus", era: "IIIe République", dates: "1859 – 1935", role: "Capitaine de l'armée française", quote: "La vérité est en marche et rien ne l'arrêtera.", bio: "Officier victime d'une erreur judiciaire antisémite retentissante, au cœur de la plus grande crise politique de la IIIe République.", anecdote: "Il fut dégradé publiquement dans la cour de l'École militaire avant d'être innocenté.", heritage: "Symbole universel de la lutte contre l'injustice et l'antisémitisme.", tags: ["Affaire Dreyfus", "Injustice"] },
            { name: "Ferdinand de Lesseps", era: "IIIe République", dates: "1805 – 1894", role: "Diplomate et entrepreneur", quote: "Relier les mers pour rapprocher les hommes.", bio: "Concepteur du canal de Suez, il se lança ensuite dans le projet tragique du canal de Panama.", anecdote: "Son nom devint synonyme d'audace financière internationale avant le grand scandale de Panama.", heritage: "Révolution des routes maritimes mondiales.", tags: ["Suez", "Panama", "Canal"] },
            { name: "Aristide Briand", era: "IIIe République", dates: "1862 – 1932", role: "Homme d'État et diplomate", quote: "La paix par le dialogue et l'arbitrage international.", bio: "Plusieurs fois président du Conseil, artisan de la loi de séparation des Églises et de l'État de 1905, prix Nobel de la paix.", anecdote: "Il était réputé pour sa voix rauque et son talent extraordinaire d'orateur conciliateur.", heritage: "Pionnier de la construction de la paix européenne.", tags: ["Laïcité", "1905", "Prix Nobel"] },

            // Première Guerre mondiale (doublons partiels harmonisés avec la IIIe République)
            // (Les entrées Clemenceau, Poincaré, Joffre, Pétain, Foch, Nivelle, Jaurès, Guillaume II, Wilson sont déjà intégrées ci-dessus)

            // Entre-deux-guerres
            { name: "Léon Blum", era: "Entre-deux-guerres", dates: "1872 – 1950", role: "Président du Conseil (Front populaire)", quote: "Le pain, la paix, la liberté.", bio: "Premier chef de gouvernement socialiste et juif de l'histoire de France, artisan des réformes du Front populaire en 1936.", anecdote: "Il fut violemment agressé par des militants d'extrême droite en voiture au cœur de Paris.", heritage: "Conquêtes sociales majeures (congés payés, 40 heures).", tags: ["Front populaire", "Congés payés", "Socialisme"] },
